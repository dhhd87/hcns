<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang chuyển hướng — Cỏ Mềm</title>
<!-- Fallback cho trình duyệt tắt JS: tự chuyển hướng sau 0 giây -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwbEwsDTde3aKAXPHibxflMBzBJANp_L2m3tKGtSWJnYRXedtjmI5hjPpOV2OcRRkxJYQ/exec">
<style>
  body{font-family:'Be Vietnam Pro',sans-serif;background:#F1F0E4;color:#1F2A20;
    display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;}
  .box{max-width:360px;padding:20px;}
  .spin{width:26px;height:26px;border:3px solid #CBCBB6;border-top-color:#42624E;border-radius:50%;
    margin:0 auto 14px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  a{color:#42624E;}
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Đang chuyển đến Cỏ Mềm — Hành chính · Nhân sự…</p>
    <p style="font-size:12px;color:#7B8474;">Nếu không tự chuyển, <a id="manualLink" href="#">bấm vào đây</a>.</p>
  </div>
  <script>
    // QUAN TRỌNG: dùng window.location (điều hướng TOÀN TRANG), KHÔNG dùng fetch()/XHR —
    // chỉ điều hướng toàn trang mới gửi kèm cookie đăng nhập Google, giúp
    // Session.getActiveUser().getEmail() phía Apps Script nhận diện được tài khoản.
    var EXEC_URL = "https://script.google.com/macros/s/AKfycbwbEwsDTde3aKAXPHibxflMBzBJANp_L2m3tKGtSWJnYRXedtjmI5hjPpOV2OcRRkxJYQ/exec";
    document.getElementById("manualLink").href = EXEC_URL;
    // replace() thay vì href = ... để nút Back của trình duyệt không quay lại đúng trang
    // trung gian này (tránh vòng lặp chuyển hướng khi bấm Back).
    window.location.replace(EXEC_URL);
  </script>
</body>
</html>

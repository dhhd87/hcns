async function loadBienBanIntoForm(ma){
  delete dataCache["bien_ban"];
  const rows = await apiList("bien_ban");
  const rec = rows.find(r=>r.bienban_ma===ma);
  if(!rec){ toast("Không tìm thấy biên bản", true); return; }
  bbEditingMa = ma;
  document.getElementById("bbSoBB").value = rec.so_bb || "";
  document.getElementById("bbNgayLap").value = vnToIso(rec.ngay_lap) || new Date().toISOString().slice(0,10);
  document.getElementById("bbNguoiLap").value = rec.nguoi_lap || "";
  document.getElementById("bbDonVi").value = rec.don_vi || "";
  document.getElementById("bbNguoiPhuTrach").value = rec.nguoi_phu_trach || "";
  document.getElementById("bbBenGiao").value = rec.ben_giao || "";
  document.getElementById("bbBenNhan").value = rec.ben_nhan || "";
  document.getElementById("bbDiaDiem").value = rec.dia_diem || "";
  const [congTy, donViSuDung] = String(rec.ghi_chu||"").split("|").map(s=>(s||"").trim());
  document.getElementById("bbCongTy").value = congTy || "";
  document.getElementById("bbDonViSuDung").value = donViSuDung || "";
  let list = [];
  try{ list = JSON.parse(rec.danh_sach_json || "[]"); }catch(e){ list = []; }
  bbRows = []; bbRowSeq = 0;
  document.getElementById("bbAssetTbody").innerHTML = "";
  list.forEach(item=>{
    const row = { id: ++bbRowSeq, cc:null, ma:item.ma||"", ten:item.ten||"", dvt:item.dvt||"Cái", sl:item.sl||1, ghichu:item.ghichu||"" };
    bbRows.push(row);
    document.getElementById("bbAssetTbody").insertAdjacentHTML("beforeend", bbRowHtml(row));
    wireBbRow(row.id);
  });
  if(!bbRows.length) addAssetRow();
  document.getElementById("bbSavedListWrap").innerHTML = "";
  document.getElementById("bbSavedListWrap").dataset.open = "0";
  toast("Đã tải biên bản " + ma + " — bấm In để in lại, hoặc chỉnh sửa rồi Lưu biên bản để cập nhật.");
}

function getBbRow(id){ return bbRows.find(r=>r.id===id); }

function bbRowHtml(row){
  return `<tr data-row="${row.id}">
    <td class="bb-stt">${bbRows.findIndex(r=>r.id===row.id)+1}</td>
    <td><div class="bb-asset-name ${row.ten?"":"empty"}" data-role="name">${row.ten || "Bấm vào đây để chọn tên tài sản"}</div></td>
    <td class="bb-col-dvt"><input type="text" data-role="dvt" value="${escAttr(row.dvt)}"></td>
    <td class="bb-col-sl"><input type="number" min="0" data-role="sl" value="${row.sl}"></td>
    <td><input type="text" data-role="ghichu" value="${escAttr(row.ghichu)}" placeholder="Ghi chú..."></td>
    <td><button class="bb-del-row" data-role="del" title="Xoá dòng">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button></td>
  </tr>`;
}

function addAssetRow(){
  const row = { id: ++bbRowSeq, cc:null, ten:"", ma:"", dvt:"Cái", sl:1, ghichu:"" };
  bbRows.push(row);
  document.getElementById("bbAssetTbody").insertAdjacentHTML("beforeend", bbRowHtml(row));
  wireBbRow(row.id);
}

function wireBbRow(id){
  const tr = document.querySelector(`tr[data-row="${id}"]`);
  if(!tr) return;
  tr.querySelector('[data-role="name"]').onclick = ()=> openAssetPicker(id);
  tr.querySelector('[data-role="dvt"]').addEventListener("input", e=>{ getBbRow(id).dvt = e.target.value; });
  tr.querySelector('[data-role="sl"]').addEventListener("input", e=>{ getBbRow(id).sl = e.target.value; });
  tr.querySelector('[data-role="ghichu"]').addEventListener("input", e=>{ getBbRow(id).ghichu = e.target.value; });
  tr.querySelector('[data-role="del"]').onclick = ()=> removeAssetRow(id);
}

function removeAssetRow(id){
  bbRows = bbRows.filter(r=>r.id!==id);
  document.querySelector(`tr[data-row="${id}"]`)?.remove();
  renumberBbRows();
}

function renumberBbRows(){
  bbRows.forEach((r,i)=>{
    const tr = document.querySelector(`tr[data-row="${r.id}"] .bb-stt`);
    if(tr) tr.textContent = i+1;
  });
}

async function openAssetPicker(rowId){
  bbPickTargetRow = rowId;
  const [ccRows, nvRows, pbRows, specRows] = await Promise.all([
    apiList("cong_cu"), apiList("nhan_vien"), apiList("phong_ban"), apiList("thongso_kythuat")
  ]);
  const nvMap = {}; nvRows.forEach(n => nvMap[n.nhanvien_ma] = n);
  const pbName = {}; pbRows.forEach(p => pbName[p.phongban_ma] = p.phongban_ten);

  function renderList(q){
    const query = (q||"").toLowerCase();
    const list = ccRows.map(cc=>({ cc, ten: computeCongCuTen(cc, specRows) }))
      .filter(x => !query || x.ten.toLowerCase().includes(query) || x.cc.cong_cu_ma.toLowerCase().includes(query));
    const listEl = document.getElementById("assetPickList");
    if(!list.length){ listEl.innerHTML = `<p class="muted">Không tìm thấy tài sản phù hợp.</p>`; return; }
    listEl.innerHTML = list.map(({cc,ten})=>{
      const nv = nvMap[cc.nhanvien_ma];
      return `<div class="asset-pick-item" data-cc="${escAttr(cc.cong_cu_ma)}">
        <b>${ten}</b> <span class="muted">(${cc.cong_cu_ma})</span>
        <div class="muted" style="font-size:12px;margin-top:2px;">${nv?nv.nhanvien_ten:"Chưa bàn giao"}${nv?(" · "+(pbName[nv.phongban_ma]||"—")):""}</div>
      </div>`;
    }).join("");
    listEl.querySelectorAll(".asset-pick-item").forEach(el=>{
      el.onclick = ()=>{
        const cc = ccRows.find(r=>r.cong_cu_ma===el.dataset.cc);
        const nv = nvMap[cc.nhanvien_ma] || null;
        const ten = computeCongCuTen(cc, specRows);
        const row = getBbRow(bbPickTargetRow);
        if(row){
          row.cc = cc; row.ma = cc.cong_cu_ma; row.ten = ten;
          row.ghichu = cc.tinhtrang_khinhan || row.ghichu;
          const tr = document.querySelector(`tr[data-row="${bbPickTargetRow}"]`);
          if(tr){
            const nameEl = tr.querySelector('[data-role="name"]');
            nameEl.textContent = ten; nameEl.classList.remove("empty");
            tr.querySelector('[data-role="ghichu"]').value = row.ghichu;
          }
        }
        if(nv){
          const donViEl = document.getElementById("bbDonVi");
          const benNhanEl = document.getElementById("bbBenNhan");
          if(donViEl) donViEl.value = pbName[nv.phongban_ma] || "";
          if(benNhanEl) benNhanEl.value = `${nv.nhanvien_ten} (${nv.nhanvien_ma})`;
        }
        closeAssetPicker();
      };
    });
  }
  renderList("");
  const searchEl = document.getElementById("assetPickSearch");
  searchEl.value = "";
  searchEl.oninput = ()=> renderList(searchEl.value.trim());
  pushOverlay("assetPickOverlay");
  document.getElementById("assetPickOverlay").classList.add("show");
}
function closeAssetPicker(){ popOverlay("assetPickOverlay"); document.getElementById("assetPickOverlay").classList.remove("show"); }
document.getElementById("assetPickClose").onclick = closeAssetPicker;
setupOverlayOutsideClick("assetPickOverlay", closeAssetPicker);

function isHttpUrl(u){ return /^https?:\/\//i.test(String(u||"").trim()); }

function openInvoiceImage(url){
  const body = document.getElementById("invoiceOverlayBody");
  body.innerHTML = "";
  if(!isHttpUrl(url)){
    body.innerHTML = `<div class="empty-state">
      <div class="lead">Đường dẫn hoá đơn không hợp lệ</div>
      <div>Giá trị đang lưu trông giống đường dẫn file trên máy tính, trình duyệt không mở được:<br>
      <code style="word-break:break-all;">${url}</code><br><br>
      Vui lòng tải ảnh lên Google Drive, bật chia sẻ "Bất kỳ ai có đường liên kết", rồi dán link chia sẻ đó vào cột hoadon_url.</div>
    </div>`;
    pushOverlay("invoiceOverlay");
    document.getElementById("invoiceOverlay").classList.add("show");
    positionFullOverlay("invoiceOverlay");
    return;
  }
  const direct = driveDirectLink(url);
  const link = document.createElement("a");
  link.href = url; link.target = "_blank";
  const img = document.createElement("img");
  img.src = direct;
  img.alt = "Hoá đơn";
  img.style.cssText = "max-width:100%;max-height:100%;width:auto;height:auto;display:block;margin:0 auto;border-radius:8px;object-fit:contain;";
  img.onerror = function(){
    img.remove();
    const fallback = document.createElement("div");
    fallback.className = "empty-state";
    fallback.innerHTML = `<div class="lead">Không xem trước được ảnh</div><a href="${url}" target="_blank">Mở hoá đơn trong tab mới</a>`;
    body.appendChild(fallback);
  };
  link.appendChild(img);
  body.appendChild(link);
  pushOverlay("invoiceOverlay");
  document.getElementById("invoiceOverlay").classList.add("show");
  positionFullOverlay("invoiceOverlay");
}

/* ---------- picker khoá ngoại: nháy đúp để chọn từ danh sách ---------- */
let relPickState = null;
async function openRelPicker(relCfg, titleText, onSelect){
  const rows = await apiList(relCfg.sheet);
  const list = relCfg.filter ? rows.filter(relCfg.filter) : rows;
  relPickState = { list, relCfg, onSelect };
  document.getElementById("relPickTitle").textContent = "Chọn " + (titleText || "giá trị").toLowerCase();
  renderRelPickList("");
  const s = document.getElementById("relPickSearch");
  s.value = "";
  s.oninput = ()=> renderRelPickList(s.value.trim());
  pushOverlay("relPickOverlay");
  document.getElementById("relPickOverlay").classList.add("show");
  setTimeout(()=>s.focus(), 50);
}
function renderRelPickList(q){
  const query = (q||"").toLowerCase();
  const { list, relCfg } = relPickState;
  const detailFields = relCfg.detailFields || [];
  const filteredList = list.filter(r=>{
    const extraText = detailFields.map(d=>r[d.field]).join(" ");
    const text = `${r[relCfg.text]||""} ${r[relCfg.value]||""} ${extraText}`.toLowerCase();
    return !query || text.includes(query);
  });
  const listEl = document.getElementById("relPickList");
  if(!filteredList.length){ listEl.innerHTML = `<p class="muted">Không tìm thấy kết quả phù hợp.</p>`; return; }
  listEl.innerHTML = filteredList.map(r=>{
    const extraHtml = detailFields.length ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin-top:6px;">
      ${detailFields.map(d=>`<div class="muted" style="font-size:11.5px;">${d.label}: ${r[d.field] ?? "—"}</div>`).join("")}
    </div>` : "";
    return `<div class="asset-pick-item" data-val="${escAttr(r[relCfg.value])}">
      <b>${r[relCfg.text] ?? "—"}</b> <span class="muted">(${r[relCfg.value]})</span>
      ${extraHtml}
    </div>`;
  }).join("");
  listEl.querySelectorAll(".asset-pick-item").forEach(el=>{
    el.onclick = ()=>{
      const rec = filteredList.find(r=>String(r[relCfg.value])===el.dataset.val);
      relPickState.onSelect(rec);
      closeRelPicker();
    };
  });
}
function closeRelPicker(){ popOverlay("relPickOverlay"); document.getElementById("relPickOverlay").classList.remove("show"); }
document.getElementById("relPickClose").onclick = closeRelPicker;
setupOverlayOutsideClick("relPickOverlay", closeRelPicker);

/* mở picker cho 1 trường khoá ngoại cụ thể trong form thêm/sửa hoặc panel chi tiết */
async function openRelFieldPicker(sheet, field, displayEl){
  const cfg = CONFIG[sheet];
  const relCfg = (cfg.relations||{})[field];
  if(!relCfg) return;
  const scopeRoot = displayEl.closest("#formBody") || displayEl.closest("#spBody");
  const hiddenEl = scopeRoot.querySelector(`[data-field="${field}"], [data-spfield="${field}"]`);
  await openRelPicker(relCfg, L(field, sheet), (rec)=>{
    if(!rec) return;
    const value = rec[relCfg.value];
    const text = `${rec[relCfg.text] ?? ""} (${value})`;
    if(hiddenEl) hiddenEl.value = value;
    displayEl.value = text;
    if(relCfg.autofill){
      Object.entries(relCfg.autofill).forEach(([targetField, srcField])=>{
        const targetEl = scopeRoot.querySelector(`[data-field="${targetField}"], [data-spfield="${targetField}"]`);
        if(targetEl) targetEl.value = rec[srcField] ?? "";
      });
    }
  });
}

/* ---------- panel chi tiết (xem / sửa 1 bản ghi + lịch sử sửa chữa công cụ) ---------- */
let spState = { sheet:null, id:null, record:null };

function handleRowClick(e, id){
  if(e.target.closest(".col-actions")) return;
  openRecordPanel(currentSheet, id);
}

async function openRecordPanel(sheet, id){
  const cfg = CONFIG[sheet];
  const rows = await apiList(sheet);
  const record = rows.find(r => idOf(r, cfg.pk) === id);
  if(!record) return;
  spState = { sheet, id, record, relMaps:{} };
  spState.relMaps = await buildRelMaps(sheet);

  document.getElementById("spEyebrow").textContent = ("CHI TIẾT " + cfg.label).toUpperCase();
  let title = cfg.pk.map(f => record[f]).join(" · ");
  if(sheet === "nhan_vien") title = record.nhanvien_ten || title;
  if(sheet === "phong_ban") title = record.phongban_ten || title;
  if(sheet === "cong_cu"){
    const specRows = await apiList("thongso_kythuat");
    title = computeCongCuTen(record, specRows);
  }
  if(sheet === "danh_muc" || sheet === "danhmuc_chitiet") title = record.danh_muc_ten || title;
  if(sheet === "thuoc_tinh") title = record.thuoc_tinh_ten || title;
  document.getElementById("spTitle").textContent = title;

  const spHead = document.getElementById("spHead");
  const photoBox = document.getElementById("spPhoto46");
  if((sheet === "nhan_vien" || sheet === "cong_cu") && record.photo_url){
    const imgEl = document.getElementById("spPhoto46Img");
    imgEl.onerror = ()=>{ photoBox.style.display = "none"; spHead.classList.remove("has-photo"); };
    imgEl.src = driveDirectLink(record.photo_url);
    photoBox.style.display = "block";
    spHead.classList.add("has-photo");
  }else{
    photoBox.style.display = "none";
    spHead.classList.remove("has-photo");
  }

  const tabsEl = document.getElementById("spTabs");
  if(sheet === "cong_cu"){
    tabsEl.innerHTML = `
      <div class="subtab active" data-tab="info" onclick="switchSpTab('info')">Thông tin</div>
      <div class="subtab" data-tab="specs" onclick="switchSpTab('specs')">Thông số kỹ thuật</div>
      <div class="subtab" data-tab="history" onclick="switchSpTab('history')">Lịch sử công cụ</div>`;
  }else{
    tabsEl.innerHTML = "";
  }
  await renderSpInfo();
  pushOverlay("sidePanelOverlay");
  document.getElementById("sidePanelOverlay").classList.add("show");
}
document.getElementById("spClose").onclick = () => { popOverlay("sidePanelOverlay"); document.getElementById("sidePanelOverlay").classList.remove("show"); };

/* xây bản đồ mã -> tên cho các trường có quan hệ (dùng ở panel chi tiết) */
async function buildRelMaps(sheet){
  const cfg = CONFIG[sheet];
  const maps = {};
  for(const [field, relCfg] of Object.entries(cfg.relations || {})){
    maps[field] = await relationMap(relCfg);
  }
  return maps;
}

function switchSpTab(tab){
  document.querySelectorAll("#spTabs .subtab").forEach(t => t.classList.toggle("active", t.dataset.tab === tab));
  if(tab === "info") renderSpInfo();
  else if(tab === "specs") renderSpSpecs();
  else renderSpHistory();
}

function spFieldView(f, val, sheet, relMaps){
  const autoInfo = findAutofillRelation(sheet, f);
  let display = (val!=null && val!=="") ? val : null;
  if(autoInfo){
    const srcVal = spState.record ? spState.record[autoInfo.srcField] : null;
    const relMap = (relMaps && relMaps[autoInfo.srcField]) || null;
    const mapped = (relMap && srcVal!=null) ? (relMap[srcVal] || relMap[normalizeCodeKey(srcVal)]) : null;
    display = mapped || display;
  }
  if(display!=null && NUMBER_FIELDS.has(f)) display = formatNumber(display);
  if(display!=null && !autoInfo && relMaps && relMaps[f] && relMaps[f][val]) display = `${relMaps[f][val]} (${val})`;
  return `<div class="sp-field"><span class="k">${L(f, sheet)}</span><span class="v">${display!=null ? display : "—"}</span></div>`;
}
function spFieldEdit(f, val, isPk, sheet){
  const cfg = CONFIG[sheet];
  if((cfg.readOnlyFields||[]).includes(f)){
    const display = (spState.readonlyValues && spState.readonlyValues[f] != null) ? spState.readonlyValues[f] : (val ?? "");
    return `<div class="field"><label>${L(f, sheet)} <span class="field-hint">(tự động)</span></label>
      <input type="text" data-spfield="${f}" value="${escAttr(display)}" readonly></div>`;
  }
  const rel = (cfg.relations||{})[f];
  if(rel){
    const relMap = (spState.relMaps||{})[f] || {};
    const displayText = (val!=null && relMap[val]) ? `${relMap[val]} (${val})` : (val!=null ? String(val) : "");
    if(isPk){
      // đang sửa bản ghi có sẵn -> khoá chính (kể cả khi đồng thời là khoá ngoại,
      // vd nhanvien_ma/ma_qua_tang) không được phép đổi qua thao tác nháy đúp
      return `<div class="field"><label>${L(f, sheet)} <span class="field-hint">(khoá chính, không thể đổi)</span></label>
        <input type="hidden" data-spfield="${f}" value="${escAttr(val ?? "")}">
        <input type="text" value="${escAttr(displayText)}" readonly></div>`;
    }
    return `<div class="field"><label>${L(f, sheet)}</label>
      <input type="hidden" data-spfield="${f}" value="${escAttr(val ?? "")}">
      <input type="text" data-rel-display="${f}" value="${escAttr(displayText)}" readonly
        placeholder="Nháy đúp để chọn ${L(f, sheet).toLowerCase()}"
        ondblclick="openRelFieldPicker('${sheet}','${f}', this)">
      <span class="field-hint-dbl">Nháy đúp vào ô để chọn từ danh sách</span></div>`;
  }
  if(isPk) return `<div class="field"><label>${L(f, sheet)} <span class="field-hint">(khoá chính)</span></label><input type="text" value="${escAttr(val ?? "")}" readonly></div>`;
  if(LONGTEXT_FIELDS.has(f)) return `<div class="field full"><label>${L(f, sheet)}</label><textarea data-spfield="${f}">${val ?? ""}</textarea></div>`;
  if(URL_FIELDS.has(f)) return imageFieldBlockHtml("data-spfield", f, sheet, val, false);
  if(DATE_FIELDS_HINT(f)) return `<div class="field"><label>${L(f, sheet)}</label><input type="date" data-spfield="${f}" data-datefield="1" value="${vnToIso(val)}"></div>`;
  return `<div class="field"><label>${L(f, sheet)}</label><input type="text" data-spfield="${f}" value="${escAttr(val ?? "")}"></div>`;
}

function renderSpInfo(){
  const cfg = CONFIG[spState.sheet];
  const record = spState.record;
  const body = document.getElementById("spBody");
  body.innerHTML = cfg.sections.map(sec => `
    <div class="sp-section">
      <div class="sp-section-title">${sec.title}</div>
      <div class="sp-fields-grid">${sec.fields.filter(f=>!HIDDEN_IN_VIEW_FIELDS.has(f)).map(f => spFieldView(f, record[f], spState.sheet, spState.relMaps)).join("")}</div>
    </div>`).join("");

  document.getElementById("spFoot").style.display = "flex";
  const editBtn = document.getElementById("spEditBtn");
  const saveBtn = document.getElementById("spSaveBtn");
  editBtn.style.display = "inline-flex";
  editBtn.textContent = "Sửa";
  editBtn.disabled = false;
  saveBtn.disabled = true;
  editBtn.onclick = enableSpEdit;
  saveBtn.onclick = saveSpInfo;
}

async function enableSpEdit(){
  const cfg = CONFIG[spState.sheet];
  const record = spState.record;
  spState.readonlyValues = {};
  for(const f of (cfg.readOnlyFields || [])){
    spState.readonlyValues[f] = await autofillDisplayValue(spState.sheet, f, record);
  }
  const body = document.getElementById("spBody");
  body.innerHTML = cfg.sections.map(sec => `
    <fieldset class="section"><legend>${sec.title}</legend><div class="field-grid">
      ${sec.fields.map(f => spFieldEdit(f, record[f], cfg.pk.includes(f), spState.sheet)).join("")}
    </div></fieldset>`).join("");
  wireImageFields(body);
  document.getElementById("spEditBtn").disabled = true;
  document.getElementById("spSaveBtn").disabled = false;
}

function saveSpInfo(){
  const cfg = CONFIG[spState.sheet];
  const sheet = spState.sheet, id = spState.id;
  const body = document.getElementById("spBody");
  const data = {};
  body.querySelectorAll("[data-spfield]").forEach(el => {
    data[el.dataset.spfield] = el.dataset.datefield ? isoToVn(el.value) : el.value.trim();
  });
  const errors = validateRecordData(data, sheet);
  if(errors.length){ toast(errors.join(" · "), true); return; }
  queueOperation("update", sheet, id, data, ()=>{
    const idx = (dataCache[sheet]||[]).findIndex(r=>idOf(r,cfg.pk)===id);
    if(idx>-1) dataCache[sheet][idx] = { ...dataCache[sheet][idx], ...data };
  });
  spState.record = (dataCache[sheet]||[]).find(r => idOf(r, cfg.pk) === id) || spState.record;
  toast("Đã cập nhật (đang đồng bộ ngầm…)");
  refreshCounts();
  if(currentSheet===sheet) loadTable();
  renderSpInfo();
}

async function renderSpHistory(){
  const cc = spState.record;
  const hisRows = await apiList("lichsu_congcu");
  const history = hisRows.filter(h => h.cong_cu_ma === cc.cong_cu_ma);
  const body = document.getElementById("spBody");
  body.innerHTML = `
    <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
      <button class="btn btn-primary btn-sm" onclick="openSpHistoryForm(null)">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
        Thêm lịch sử
      </button>
    </div>
    ${history.length ? history.map(h => `
      <div class="sp-history-item" onclick="openSpHistoryForm('${escAttr(h.lich_su_ma)}')">
        <div class="sp-history-top"><b>${h.ngay_sua || "—"}</b><span class="tag honey">${h.trang_thai || "—"}</span></div>
        <div class="muted" style="font-size:12.5px;">${h.ly_do_sua || "—"}${h.chi_phi_sua ? " · " + formatNumber(h.chi_phi_sua) + " đ" : ""}</div>
      </div>`).join("") : '<p class="muted">Chưa có lịch sử công cụ.</p>'}
  `;
  document.getElementById("spFoot").style.display = "none";
}

async function openSpHistoryForm(hisId, forceEdit){
  const cfg = CONFIG.lichsu_congcu;
  const rows = hisId ? await apiList("lichsu_congcu") : [];
  const record = hisId ? rows.find(r => idOf(r, cfg.pk) === hisId) : { cong_cu_ma: spState.record.cong_cu_ma };
  const allFields = cfg.sections.flatMap(s => s.fields);
  const locked = !!hisId && !forceEdit; // bản ghi đã có: mặc định khoá, chỉ xem

  // thêm mới: tự sinh Mã lịch sử (giống các sheet AUTO_CODE_SHEETS khác)
  let autoCode = null;
  if(!hisId){
    autoCode = await apiFetchNextCode("lichsu_congcu");
  }

  const body = document.getElementById("spBody");
  body.innerHTML = `
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" onclick="renderSpHistory()">‹ Quay lại danh sách</button>
    <div class="field-grid">
      ${allFields.map(f => {
        const isPk = cfg.pk.includes(f);
        const isCongCuMa = f === "cong_cu_ma"; // luôn cố định theo công cụ đang xem, không cho đổi
        const isLichSuMa = f === "lich_su_ma"; // tự sinh khi thêm mới, không cho gõ tay
        let val = record[f] != null ? record[f] : "";
        if(isLichSuMa && !hisId && autoCode) val = autoCode;
        const fieldLocked = locked || isCongCuMa || (isLichSuMa && !hisId && autoCode) || (isPk && hisId);
        const pkNote = isLichSuMa ? ' <span class="field-hint">(tự sinh)</span>'
          : (isCongCuMa ? ' <span class="field-hint">(cố định theo công cụ đang xem)</span>' : '');
        if(locked && HIDDEN_IN_VIEW_FIELDS.has(f)) return "";
        if(LONGTEXT_FIELDS.has(f)) return `<div class="field full"><label>${L(f, "lichsu_congcu")}</label><textarea data-hfield="${f}" ${locked?"disabled":""}>${val}</textarea></div>`;
        if(URL_FIELDS.has(f)) return imageFieldBlockHtml("data-hfield", f, "lichsu_congcu", val, locked);
        if(DATE_FIELDS_HINT(f)) return `<div class="field"><label>${L(f, "lichsu_congcu")}</label><input type="date" data-hfield="${f}" data-datefield="1" value="${vnToIso(val)}" ${locked?"disabled":""}></div>`;
        return `<div class="field"><label>${L(f, "lichsu_congcu")}${pkNote}</label><input type="text" data-hfield="${f}" value="${escAttr(val)}" ${fieldLocked?"disabled":""}></div>`;
      }).join("")}
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
      <button class="btn btn-ghost" id="hEditBtn" ${locked ? "" : "disabled"}>Sửa</button>
      <button class="btn btn-primary" id="hSaveBtn" ${locked ? "disabled" : ""}>Lưu lại</button>
    </div>
  `;
  wireImageFields(body);
  document.getElementById("spFoot").style.display = "none";

  document.getElementById("hEditBtn").onclick = () => {
    openSpHistoryForm(hisId, true);
  };
  document.getElementById("hSaveBtn").onclick = () => {
    const data = {};
    body.querySelectorAll("[data-hfield]").forEach(el => {
      data[el.dataset.hfield] = el.dataset.datefield ? isoToVn(el.value) : el.value.trim();
    });
    const sheet = "lichsu_congcu";
    const hCfg = CONFIG[sheet];
    if(!hisId && !data.lich_su_ma){ toast("Vui lòng nhập Mã lịch sử", true); return; }
    const errors = validateRecordData(data);
    if(errors.length){ toast(errors.join(" · "), true); return; }
    queueOperation(hisId ? "update" : "create", sheet, hisId || null, data, ()=>{
      if(!dataCache[sheet]) dataCache[sheet] = [];
      if(hisId){
        const idx = dataCache[sheet].findIndex(r=>idOf(r,hCfg.pk)===hisId);
        if(idx>-1) dataCache[sheet][idx] = { ...dataCache[sheet][idx], ...data };
      }else{
        dataCache[sheet] = [...dataCache[sheet], { ...data }];
      }
    });
    toast("Đã lưu lịch sử (đang đồng bộ ngầm…)");
    refreshCounts();
    renderSpHistory();
  };
}

/* ---------- chi tiết công cụ (thông số kỹ thuật + lịch sử sửa chữa) ---------- */
async function openDetail(id){
  const rows = await apiList("cong_cu");
  const cc = rows.find(r=>idOf(r,["cong_cu_ma"])===id);
  if(!cc) return;
  document.getElementById("detailTitle").textContent = `Chi tiết công cụ · ${cc.cong_cu_ma}`;

  const [nvRows, specRows, tenAttrRows, hisRows, pbRows] = await Promise.all([
    apiList("nhan_vien"), apiList("thongso_kythuat"), apiList("thuoc_tinh"), apiList("lichsu_congcu"), apiList("phong_ban")
  ]);
  const nv = nvRows.find(r=>r.nhanvien_ma===cc.nhanvien_ma);
  const pb = nv ? pbRows.find(p=>p.phongban_ma===nv.phongban_ma) : null;
  const attrName = {}; tenAttrRows.forEach(a=>attrName[a.thuoc_tinh_ma]=a.thuoc_tinh_ten);
  const specs = specRows.filter(s=>s.cong_cu_ma===cc.cong_cu_ma);
  const history = hisRows.filter(h=>h.cong_cu_ma===cc.cong_cu_ma);

  const body = document.getElementById("detailBody");
  body.innerHTML = `
    ${cc.photo_url ? `<div class="img-preview" style="max-width:220px;margin-bottom:14px;"><img src="${driveDirectLink(cc.photo_url)}" onerror="this.parentElement.style.display='none'"></div>` : ""}
    <div class="info-card">
      <div><span class="k">Nhân sự đang dùng</span><span class="v">${nv?nv.nhanvien_ten:"—"} (${cc.nhanvien_ma||"—"})</span></div>
      <div><span class="k">Phòng ban</span><span class="v">${pb?pb.phongban_ten:"—"}</span></div>
      <div><span class="k">Khu vực</span><span class="v">${cc.khu_vuc||"—"}</span></div>
      <div><span class="k">Giá trị tài sản (VNĐ)</span><span class="v">${cc.gia_tri?formatNumber(cc.gia_tri):"—"}</span></div>
      <div><span class="k">Ngày nhận</span><span class="v">${cc.ngay_nhan||"—"}</span></div>
      <div><span class="k">Tình trạng khi nhận</span><span class="v">${cc.tinhtrang_khinhan||"—"}</span></div>
      <div><span class="k">Bản quyền hệ điều hành</span><span class="v">${cc.banquyen_hedieuhanh||"—"}</span></div>
      <div><span class="k">Bản quyền Office</span><span class="v">${cc.banquyen_office||cc.banquyen_EOM||"—"}</span></div>
    </div>

    <h3 class="serif" style="font-size:15px;margin:0 0 8px;color:var(--forest-deep);">Thông số kỹ thuật</h3>
    ${specs.length? `<table class="mini-table"><thead><tr><th>Thuộc tính</th><th>Giá trị</th></tr></thead>
      <tbody>${specs.map(s=>`<tr><td>${attrName[s.thuoc_tinh_ma]||s.thuoc_tinh_ma}</td><td>${s.gia_tri||"—"}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="font-size:12.8px;">Chưa có thông số kỹ thuật được ghi nhận.</p>`}

    <h3 class="serif" style="font-size:15px;margin:18px 0 8px;color:var(--forest-deep);">Lịch sử công cụ</h3>
    ${history.length? `<table class="mini-table"><thead><tr><th>Ngày</th><th>Lý do</th><th>Nội dung sửa</th><th>Chi phí</th><th>Trạng thái sửa chữa</th><th>Hoá đơn</th></tr></thead>
      <tbody>${history.map(h=>`<tr><td>${h.ngay_sua||"—"}</td><td>${h.ly_do_sua||"—"}</td><td>${h.noi_dung_sua||"—"}</td><td>${h.chi_phi_sua?formatNumber(h.chi_phi_sua):"—"}</td><td><span class="tag honey">${h.trang_thai||"—"}</span></td><td>${h.hoadon_url?`<a href="${h.hoadon_url}" target="_blank">Xem</a>`:"—"}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="font-size:12.8px;">Chưa có lịch sử công cụ.</p>`}
  `;
  pushOverlay("detailOverlay");
  document.getElementById("detailOverlay").classList.add("show");
}
document.getElementById("detailClose").onclick = ()=> { popOverlay("detailOverlay"); document.getElementById("detailOverlay").classList.remove("show"); };

/* ---------- menu trái: ẩn/hiện panel (mobile: trượt che nội dung; desktop: thu gọn) ---------- */
function isMobileView(){ return window.matchMedia("(max-width:880px)").matches; }
/* dùng khi chuyển mục menu (tự đóng panel trên mobile), không ảnh hưởng chế độ desktop */
function setSidebarOpen(open){
  if(!isMobileView()) return;
  document.getElementById("sidebar").classList.toggle("open", open);
  document.getElementById("sidebarBackdrop").classList.toggle("show", open);
}
/* nút menu (☰): trên mobile trượt hiện/ẩn panel; trên desktop thu gọn/mở rộng panel */
function toggleSidebar(){
  const sidebar = document.getElementById("sidebar");
  if(isMobileView()){
    setSidebarOpen(!sidebar.classList.contains("open"));
  }else{
    sidebar.classList.toggle("collapsed");
  }
  // sidebar thu gọn/mở rộng có transition riêng -> canh lại vùng full-screen vài lần trong lúc chuyển động
  [0,60,120,200,300].forEach(t => setTimeout(repositionOpenFullOverlays, t));
}
document.getElementById("menuToggle").onclick = toggleSidebar;
document.getElementById("sidebarBackdrop").onclick = ()=> setSidebarOpen(false);

/* ---------- canh vùng full-screen cho form Thêm/Sửa & xem hoá đơn: luôn lấp đầy
   phần màn hình còn lại sau khi trừ đi sidebar bên trái (kể cả khi sidebar
   thu gọn trên desktop hoặc ẩn trên mobile) ---------- */
function positionFullOverlay(overlayId){
  const overlay = document.getElementById(overlayId);
  if(!overlay) return;
  if(isMobileView()){
    overlay.style.left = "0px";
    overlay.style.width = "100vw";
    return;
  }
  const mainEl = document.querySelector(".main");
  if(!mainEl) return;
  const rect = mainEl.getBoundingClientRect();
  overlay.style.left = Math.round(rect.left) + "px";
  overlay.style.width = Math.round(rect.width) + "px";
}
function repositionOpenFullOverlays(){
  ["formOverlay","invoiceOverlay"].forEach(id=>{
    const el = document.getElementById(id);
    if(el && el.classList.contains("show")) positionFullOverlay(id);
  });
}
window.addEventListener("resize", repositionOpenFullOverlays);

/* ---------- khởi động ---------- */
(async function init(){
  buildNav();
  setupOverlayOutsideClick("formOverlay", closeForm);
  setupOverlayOutsideClick("detailOverlay", ()=>{ popOverlay("detailOverlay"); document.getElementById("detailOverlay").classList.remove("show"); });
  setupOverlayOutsideClick("confirmOverlay", ()=>{ popOverlay("confirmOverlay"); document.getElementById("confirmOverlay").classList.remove("show"); });
  setupOverlayOutsideClick("sidePanelOverlay", ()=>{ popOverlay("sidePanelOverlay"); document.getElementById("sidePanelOverlay").classList.remove("show"); });
  document.getElementById("invoiceOverlayClose").onclick = ()=>{ popOverlay("invoiceOverlay"); document.getElementById("invoiceOverlay").classList.remove("show"); };
  setupOverlayOutsideClick("invoiceOverlay", ()=>{ popOverlay("invoiceOverlay"); document.getElementById("invoiceOverlay").classList.remove("show"); });
  await switchSheet("tong_quan");
  refreshCounts();
  checkApiHealth();
  renderSyncBadge();
  if(syncQueue.length) processSyncQueue();
})();

/* kiểm tra kết nối API ngay khi mở trang: nếu deployment sai/hết quyền,
   báo cho người dùng biết sớm thay vì chỉ phát hiện khi bấm Lưu */
async function checkApiHealth(){
  try{
    const json = await apiGet("ping", {}, 12000);
    if(!json || !json.success) throw new Error("ping thất bại");
  }catch(e){
    toast("Không kết nối được máy chủ dữ liệu. Việc xem danh sách có thể vẫn hoạt động do dữ liệu đã tải sẵn, nhưng Thêm/Sửa/Xoá sẽ báo lỗi. Vui lòng kiểm tra lại bản triển khai (deployment) Apps Script.", true);
  }
}

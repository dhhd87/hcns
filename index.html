<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yến · Hành chính – Nhân sự</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Cpath d='M15 26C15 26 5 21 5 12.5C5 8 8 4.5 12 4.5C13.8 4.5 15 5.5 15 5.5C15 5.5 16.2 4.5 18 4.5C22 4.5 25 8 25 12.5C25 21 15 26 15 26Z' fill='%2393AF89' stroke='%232B4635' stroke-width='1.6'/%3E%3Cpath d='M15 26V10' stroke='%232B4635' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F1F0E4;
    --paper-deep:#E8E6D6;
    --ink:#1F2A20;
    --forest:#42624E;
    --forest-deep:#2B4635;
    --sage:#93AF89;
    --sage-deep:#75946B;
    --moss:#E6EBDC;
    --honey:#C99A4B;
    --honey-deep:#A97F35;
    --clay:#B65C42;
    --line:#CBCBB6;
    --white:#FFFEF9;
    --radius:10px;
    --shadow:0 6px 18px rgba(31,42,32,.08);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Be Vietnam Pro',sans-serif;
    font-size:14.5px;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Be Vietnam Pro',sans-serif;}
  ::selection{background:var(--honey);color:var(--forest-deep);}

  /* ---------- layout ---------- */
  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:282px;flex:none;
    background:linear-gradient(180deg,var(--forest) 0%, var(--forest-deep) 100%);
    color:var(--paper);
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
    overflow:hidden; /* để mượt khi thu gọn (width->0) không bị tràn nội dung */
    transition:width .28s cubic-bezier(.4,0,.2,1), transform .28s cubic-bezier(.4,0,.2,1);
  }
  .brand{
    padding:26px 22px 18px;
    border-bottom:1px solid rgba(241,240,228,.14);
  }
  .brand .mark{
    display:flex;align-items:center;gap:10px;
  }
  .brand .mark svg{flex:none;}
  .brand-name{font-family:'Be Vietnam Pro',sans-serif;font-size:22px;font-weight:600;letter-spacing:.3px;color:var(--paper);}
  .brand-sub{margin-top:4px;font-size:12px;color:#B9C6B3;letter-spacing:.2px;}

  .nav{flex:1;overflow-y:auto;padding:14px 12px;}
  .nav-group-label{font-size:11px;color:#8FA087;margin:14px 10px 6px;letter-spacing:.6px;font-weight:600;}
  .nav-item{
    display:flex;align-items:center;gap:11px;
    padding:9px 11px;margin:2px 0;border-radius:8px;
    color:#D9E1D3;text-decoration:none;cursor:pointer;
    font-size:14px;transition:background .15s ease,color .15s ease;
  }
  .nav-item svg{flex:none;opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{background:var(--paper);color:var(--forest-deep);font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-count{margin-left:auto;font-size:11.5px;color:#93A68B;}
  .nav-item.active .nav-count{color:var(--sage-deep);}
  .nav-item.nav-parent .nav-count{margin-left:8px;}
  .chev-wrap{margin-left:2px;display:inline-flex;align-items:center;color:#93A68B;transition:transform .15s ease;flex:none;}
  .chev-wrap.open{transform:rotate(90deg);}
  .nav-item.active .chev-wrap{color:var(--sage-deep);}
  .nav-children{max-height:0;overflow:hidden;transition:max-height .18s ease;}
  .nav-children.open{max-height:360px;}
  .nav-subitem{
    display:flex;align-items:center;gap:9px;
    padding:7px 11px 7px 32px;margin:1px 0;border-radius:8px;
    color:#B9C6B3;cursor:pointer;font-size:12.8px;transition:background .15s ease,color .15s ease;
  }
  .nav-subitem .dot{width:5px;height:5px;border-radius:50%;background:#7C9473;flex:none;}
  .nav-subitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-subitem.active{background:var(--paper);color:var(--forest-deep);font-weight:600;}
  .nav-subitem.active .dot{background:var(--sage-deep);}

  .sidebar-foot{
    padding:14px 22px 20px;font-size:11.5px;color:#8FA087;
    border-top:1px solid rgba(241,240,228,.14);
  }

  /* ---------- main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    padding:22px 30px 14px;
    display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
    flex-wrap:wrap;
  }
  .topbar h1{margin:0;font-size:26px;font-weight:600;color:var(--forest-deep);}
  .topbar .desc{margin:4px 0 0;color:#5D6B57;font-size:13.5px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}

  .search-box{
    display:flex;align-items:center;gap:8px;
    background:var(--white);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;min-width:230px;
  }
  .search-box input{border:none;outline:none;background:none;font-family:inherit;font-size:13.5px;width:100%;color:var(--ink);}
  .search-box svg{flex:none;color:#8B9583;}

  /* ---------- bộ lọc nhanh theo cột (trên các danh sách) ---------- */
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--moss);}
  .filter-bar select{border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-family:inherit;font-size:12.8px;color:var(--forest-deep);background:var(--white);outline:none;flex:1 1 160px;min-width:150px;cursor:pointer;}
  .filter-bar select:focus{border-color:var(--sage);}
  @media (max-width:880px){
    .filter-bar{padding:12px;gap:8px;}
    .filter-bar select{flex:1 1 100%;min-width:0;}
  }

  /* ---------- hàng tiêu đề: nút menu ngang hàng với chữ ---------- */
  .topbar-title-row{display:flex;align-items:center;gap:10px;}
  .topbar-title-row h1{margin:0;}

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border:none;border-radius:8px;padding:9px 16px;
    font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;
    transition:filter .15s ease, transform .05s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--sage);color:#fff;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:transparent;color:var(--forest-deep);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--white);}
  .btn-danger{background:#fff;color:var(--clay);border:1px solid #E4C9BE;}
  .btn-danger:hover{background:#FBF1EC;}
  .btn-sm{padding:6px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .content{padding:6px 30px 40px;flex:1;}

  /* ---------- table ledger ---------- */
  .ledger{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    box-shadow:var(--shadow);
  }
  table{width:100%;border-collapse:collapse;}
  thead th{
    text-align:left;font-family:'Be Vietnam Pro',sans-serif;font-weight:500;font-size:13px;
    color:var(--forest-deep);padding:12px 16px;
    background:var(--moss);border-bottom:1px solid var(--line);
    white-space:nowrap;
    position:sticky;top:0;z-index:2;
  }
  thead th.th-sortable{cursor:pointer;user-select:none;}
  thead th.th-sortable:hover{color:var(--sage-deep);}
  tbody td{
    padding:11px 16px;border-bottom:1px solid #ECEBDD;
    font-size:13.3px;color:var(--ink);vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FBFAF2;}
  tbody tr.clickable-row{cursor:pointer;}
  td.muted,span.muted{color:#9AA391;}
  .col-actions{white-space:nowrap;text-align:right;}
  .icon-btn{
    border:none;background:none;cursor:pointer;padding:6px;border-radius:6px;
    color:#6C7A64;display:inline-flex;
  }
  .icon-btn:hover{background:var(--moss);color:var(--forest-deep);}
  .icon-btn.danger:hover{background:#FBEAE3;color:var(--clay);}

  .tag{
    display:inline-block;padding:2.5px 9px;border-radius:20px;
    font-size:11.5px;font-weight:600;background:var(--moss);color:var(--sage-deep);
  }
  .tag.honey{background:#F4E8D3;color:var(--honey-deep);}
  .tag.clay{background:#F6E2DA;color:var(--clay);}
  .tag.gray{background:#ECEBE2;color:#7B8474;}

  .empty-state{padding:60px 20px;text-align:center;color:#7B8474;}
  .empty-state svg{margin-bottom:10px;}
  .empty-state .lead{font-family:'Be Vietnam Pro',sans-serif;font-size:17px;color:var(--forest-deep);margin-bottom:4px;}

  .foot-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:12.5px;color:#7B8474;}
  .pager{display:flex;gap:6px;}
  .pager button{
    border:1px solid var(--line);background:var(--white);border-radius:6px;
    padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--forest-deep);
  }
  .pager button.active{background:var(--sage);color:#fff;border-color:var(--sage);}
  .pager button:disabled{opacity:.4;cursor:default;}

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(29,46,34,.42);
    display:none;align-items:flex-start;justify-content:center;
    padding:36px 16px;overflow-y:auto;z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--white);border-radius:12px;width:100%;max-width:640px;
    box-shadow:0 20px 50px rgba(20,30,20,.25);
    animation:pop .16s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98);}to{opacity:1;transform:none;}}
  .modal.wide{max-width:1100px;}

  /* ---------- form "Thêm/Sửa" & xem hoá đơn: mở full phần màn hình còn lại
     (trừ sidebar bên trái), thay vì hộp thoại nhỏ giữa màn hình ---------- */
  #formOverlay,#invoiceOverlay{padding:0;align-items:stretch;justify-content:flex-start;}
  #formOverlay .modal,#invoiceOverlay .modal{
    max-width:none;width:100%;height:100vh;border-radius:0;
    display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(20,30,20,.18);
    animation:slideinFull .16s ease;
  }
  #formOverlay .modal-body{flex:1;min-height:0;max-height:none;}
  #invoiceOverlay .modal-body{flex:1;min-height:0;max-height:none;display:flex;align-items:center;justify-content:center;}
  @keyframes slideinFull{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
  @media (max-width:880px){
    #formOverlay .modal,#invoiceOverlay .modal{max-width:100vw;}
  }
  .modal-head{
    padding:20px 24px;border-bottom:1px solid #ECEBDD;
    display:flex;align-items:center;justify-content:space-between;
  }
  .modal-head h2{margin:0;font-size:19px;color:var(--forest-deep);font-weight:600;}
  .modal-close{border:none;background:none;cursor:pointer;color:#8B9583;padding:4px;}
  .modal-close:hover{color:var(--clay);}
  .modal-body{padding:22px 24px;max-height:78vh;overflow-y:auto;}
  .modal-foot{padding:16px 24px;border-top:1px solid #ECEBDD;display:flex;justify-content:flex-end;gap:10px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:12.5px;color:#5D6B57;font-weight:600;}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);border-radius:7px;padding:9px 11px;
    font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--white);
    outline:none;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--sage);background:#fff;}
  .field input[data-rel][readonly]{cursor:pointer;background:var(--moss);}
  .field-hint-dbl{font-size:11px;color:#8B9583;margin-top:2px;}
  .field textarea{resize:vertical;min-height:56px;}
  .field-hint{font-size:11px;color:#9AA391;}
  fieldset.section{border:none;padding:0;margin:0 0 18px;}
  fieldset.section legend{
    font-family:'Be Vietnam Pro',sans-serif;font-size:13.5px;color:var(--sage-deep);
    padding:0 0 8px;width:100%;border-bottom:1px dashed var(--line);margin-bottom:12px;
  }

  /* ---------- detail drawer (công cụ) ---------- */
  .subtabs{display:flex;gap:6px;margin-bottom:14px;}
  .subtab{
    padding:7px 14px;border-radius:7px;font-size:12.8px;cursor:pointer;
    color:#5D6B57;font-weight:600;border:1px solid transparent;
  }
  .subtab.active{background:var(--moss);color:var(--forest-deep);}
  .mini-table{width:100%;border-collapse:collapse;margin-bottom:10px;}
  .mini-table th{text-align:left;font-size:11.5px;color:#7B8474;padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600;}
  .mini-table td{padding:8px 10px;font-size:12.8px;border-bottom:1px solid #F0EFE3;}
  .info-card{
    background:var(--white);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;margin-bottom:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;
  }
  .info-card div span.k{display:block;font-size:11px;color:#8B9583;}
  .info-card div span.v{font-size:13.3px;color:var(--ink);font-weight:500;}

  /* ---------- toast ---------- */
  #toast-wrap{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:100;}
  .toast{
    background:var(--forest-deep);color:#fff;padding:11px 18px;border-radius:8px;
    font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.18);
    display:flex;align-items:center;gap:9px;min-width:220px;
    animation:slide .18s ease;
  }
  .toast.error{background:#7A3324;}
  @keyframes slide{from{opacity:0;transform:translateX(14px);}to{opacity:1;transform:none;}}

  .loading-row{padding:26px;text-align:center;color:#8B9583;font-size:13px;}

  /* ---------- filter chip (từ Tổng quan drill-down) ---------- */
  .filter-chip{display:none;align-items:center;gap:8px;background:var(--moss);color:var(--forest-deep);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;}
  .filter-chip.show{display:inline-flex;}
  .filter-chip button{border:none;background:none;cursor:pointer;color:var(--forest-deep);font-size:15px;line-height:1;padding:0;}

  /* ---------- Tổng quan (dashboard) ---------- */
  .ledger.plain{background:none;border:none;box-shadow:none;overflow:visible;}
  .ov-refresh-chip{display:inline-flex;align-items:center;gap:6px;background:var(--white);border:1px solid var(--line);
    color:#7B8474;padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:600;float:right;margin:0 2px 14px;cursor:pointer;}
  .ov-refresh-chip:hover{background:var(--moss);color:var(--forest-deep);}
  .ov-refresh-chip svg{opacity:.75;color:var(--sage-deep);}
  .ov-updated{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:11.5px;color:#8B9583;padding:0 2px 10px;}
  .ov-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:2px 2px 16px;}
  .ov-kpi{background:linear-gradient(135deg,var(--forest) 0%, var(--forest-deep) 100%);color:var(--paper);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .ov-kpi .num{font-family:'Be Vietnam Pro',sans-serif;font-size:27px;font-weight:600;line-height:1.1;}
  .ov-kpi .lbl{font-size:12px;color:#C7D3C0;margin-top:5px;}
  .ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;padding:2px 2px 16px;}
  .ov-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
  .ov-card-head{margin-bottom:10px;}
  .ov-card-head h3{margin:0;font-family:'Be Vietnam Pro',sans-serif;font-size:15px;color:var(--forest-deep);font-weight:600;}
  .ov-card-head span{font-size:11.5px;color:#8B9583;}
  .ov-row{padding:8px 0;border-bottom:1px solid #F3F2E6;}
  .ov-row:last-child{border-bottom:none;}
  .ov-row-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:5px;color:var(--ink);}
  .ov-arrow{color:#9AA391;margin-left:4px;}
  .ov-bar{height:6px;background:var(--moss);border-radius:4px;overflow:hidden;}
  .ov-bar-fill{height:100%;background:var(--sage);border-radius:4px;}

  /* ---------- side detail panel (xem/sửa 1 bản ghi) ---------- */
  .side-panel-overlay{position:fixed;inset:0;background:rgba(29,46,34,.35);display:none;justify-content:flex-end;z-index:55;}
  .side-panel-overlay.show{display:flex;}
  .side-panel{width:660px;max-width:96vw;height:100vh;background:var(--white);
    box-shadow:-14px 0 40px rgba(20,30,20,.18);display:flex;flex-direction:column;animation:slidein .18s ease;}
  @keyframes slidein{from{transform:translateX(24px);opacity:.6;}to{transform:none;opacity:1;}}
  .side-panel-head{padding:20px 22px 14px;border-bottom:1px solid #ECEBDD;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .side-panel-eyebrow{font-size:11px;letter-spacing:.6px;color:#8B9583;font-weight:700;margin-bottom:3px;}
  .side-panel-head h2{margin:0;font-size:18px;color:var(--forest-deep);font-family:'Be Vietnam Pro',sans-serif;font-weight:600;}
  .side-panel-tabs{display:flex;gap:6px;padding:12px 22px 0;flex:none;}
  .side-panel-body{flex:1;overflow-y:auto;padding:18px 22px;}
  .side-panel-foot{padding:14px 22px;border-top:1px solid #ECEBDD;display:flex;justify-content:flex-end;gap:10px;flex:none;}
  .sp-section{margin-bottom:16px;}
  .sp-section-title{font-family:'Be Vietnam Pro',sans-serif;font-size:13px;color:var(--sage-deep);border-bottom:1px dashed var(--line);padding-bottom:6px;margin-bottom:10px;}
  .sp-fields-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .sp-field{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid #F3F2E6;font-size:13px;}
  .sp-field .k{color:#8B9583;flex:none;}
  .sp-field .v{color:var(--ink);font-weight:500;text-align:right;}
  .sp-history-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--white);}
  .sp-history-item:hover{background:var(--moss);}
  .sp-history-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;font-size:13px;}

  /* ảnh đại diện nhân viên dạng 4x6, góc phải phía trên panel chi tiết */
  .side-panel-head{position:relative;}
  /* nút đóng (X) ghim cố định, nằm bên phải ngoài cùng, tách riêng khỏi ảnh đại diện */
  .modal-close#spClose{position:absolute;top:14px;right:16px;z-index:3;}
  /* ảnh đại diện đặt lệch sang trái của nút X (cùng hàng ngang) để không bị che/đè lên nhau */
  .sp-photo-46{position:absolute;top:14px;right:54px;width:96px;height:96px;border-radius:50%;overflow:hidden;
    border:3px solid var(--moss);box-shadow:var(--shadow);background:var(--paper);flex:none;z-index:1;}
  .sp-photo-46 img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}
  .sp-head-text{flex:1 1 auto;min-width:0;padding-right:36px;}
  .side-panel-head.has-photo .sp-head-text{max-width:calc(100% - 168px);}
  .side-panel-head h2{overflow-wrap:break-word;word-break:normal;}

  /* ---------- biên bản bàn giao: mẫu in ---------- */
  .bb-doc{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    max-width:820px;margin:0 auto;padding:32px 40px 40px;}
  .bb-doc h2{text-align:center;margin:0 0 2px;font-size:19px;color:var(--forest-deep);letter-spacing:.3px;}
  .bb-doc .bb-sub{text-align:center;font-size:12.5px;color:#5D6B57;font-style:italic;margin-bottom:22px;}
  .bb-head-grid{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;}
  .bb-head-left{font-size:13px;line-height:1.7;}
  .bb-head-right{text-align:center;font-size:13px;line-height:1.7;min-width:280px;}
  .bb-head-right b{color:var(--forest-deep);}
  .bb-so-line{text-align:right;font-size:12.5px;color:#5D6B57;margin:10px 0 4px;}

  .asset-pick-list{max-height:340px;overflow-y:auto;}

  .asset-pick-item:hover{background:var(--moss);}
  .asset-pick-item b{color:var(--forest-deep);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spin{animation:spin .8s linear infinite;}
  @media print{
    .sidebar,.topbar,.bb-actions,#toast-wrap{display:none !important;}
    .content{padding:0;}

  /* ---------- widget tải ảnh lên (browse máy tính / chụp camera) ---------- */
  .img-field{gap:8px;}
  .img-preview{width:100%;max-width:260px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--moss);}

  .table-scroll{overflow:auto; -webkit-overflow-scrolling:touch; max-height:70vh;}

  .menu-toggle{display:inline-flex;align-items:center;justify-content:center;border:none;background:var(--forest);color:#fff;border-radius:7px;padding:8px 10px;cursor:pointer;}

<script>
/* =========================================================================
   CỎ MỀM — QUẢN LÝ HÀNH CHÍNH NHÂN SỰ
   Single-page app, vanilla JS, gọi Google Apps Script Web App làm API
   để đọc/ghi trực tiếp vào Google Sheet.
   ========================================================================= */

// Khi Apps Script tự lưu trữ giao diện này (file "index" trong project),
// URL này chính là ĐÚNG địa chỉ /exec mà bạn đang mở trên trình duyệt —
// vì vậy trang web và API cùng 1 origin, không còn bị chặn CORS như khi
// mở file .html trực tiếp (file://) trước đây. Nếu bạn deploy lại (Sửa ->
// Phiên bản mới, KHÔNG tạo deployment mới), link /exec này giữ nguyên nên
// không cần sửa gì thêm.
const API_URL = "https://script.google.com/macros/s/AKfycbwbEwsDTde3aKAXPHibxflMBzBJANp_L2m3tKGtSWJnYRXedtjmI5hjPpOV2OcRRkxJYQ/exec";

/* ---------- nhãn tiếng Việt cho tên cột (dùng chung cho mọi sheet) ---------- */
const LABELS = {
  nhanvien_ma:"Mã nhân sự", nhanvien_ten:"Họ và tên", gioi_tinh:"Giới tính", ngay_sinh:"Ngày sinh",
  phone:"Số điện thoại", ngay_thu_viec:"Ngày thử việc", ngay_chinh_thuc:"Ngày chính thức", email:"Email",
  phongban_ma:"Phòng ban", khu_vuc:"Khu vực", chuc_vu:"Chức vụ", bhxh_ma:"Mã BHXH",
  cmnd_ma:"Số CMND", cmnd_ngaycap:"Ngày cấp CMND", cmnd_noicap:"Nơi cấp CMND",
  cccd_ma:"Số CCCD", cccd_ngaycap:"Ngày cấp CCCD", cccd_noicap:"Nơi cấp CCCD",
  ma_so_thue:"Mã số thuế", dia_chi:"Địa chỉ", so_tai_khoan:"Số tài khoản",
  ngan_hang:"Ngân hàng", chinhanh_nganhang:"Chi nhánh ngân hàng", chuyen_mon:"Chuyên môn",
  bang_cap:"Bằng cấp", trangthai_bangcap:"Trạng thái bằng cấp", trangthai_hoso:"Trạng thái hồ sơ",
  trang_thai:"Loại hình lao động", tinh_trang:"Tình trạng làm việc", ngay_nghi_viec:"Ngày nghỉ việc",
  photo_url:"Ảnh đại diện (URL)",
  phongban_ten:"Tên phòng ban", vung_mien:"Vùng miền",
  cong_cu_ma:"Mã công cụ", cong_cu_ten:"Tên công cụ", banquyen_hedieuhanh:"BQ hệ điều hành", banquyen_EOM:"BQ EOM (Office)",
  banquyen_office:"Bản quyền Office", ngay_nhan:"Ngày nhận", tinhtrang_khinhan:"Tình trạng khi nhận",
  lich_su:"Đã có lịch sử sửa?", ghi_chu:"Ghi chú",
  danh_muc_ma:"Danh mục", thuoc_tinh_ma:"Thuộc tính kỹ thuật", gia_tri:"Giá trị",
  thuoc_tinh_ten:"Tên thuộc tính",
  lich_su_ma:"Mã lịch sử", ngay_sua:"Ngày sửa", nhan_vien_ma:"Nhân sự phụ trách",
  nhan_vien_ten:"Tên người phụ trách", ly_do_sua:"Lý do sửa chữa", noi_sua:"Nơi sửa chữa",
  chi_phi_sua:"Chi phí sửa (VNĐ)", nguyen_nhan:"Nguyên nhân", noi_dung_sua:"Nội dung đã sửa",
  han_bao_hanh:"Hạn bảo hành",
  danh_muc_ten:"Tên danh mục", nhom:"Nhóm", hinh_thuc:"Hình thức", ten_nhom:"Tên nhóm lớn",
  danh_muc_cha:"Thuộc danh mục cha", danh_muc_cha_ten:"Tên danh mục cha",
  danh_muc_ma_ten:"Tên danh mục",
  ma_qua_tang:"Quà tặng/Đồng phục", ngay_phat:"Ngày phát quà",
  hoadon_url:"Hoá đơn (ảnh/URL)"
};
/* nhãn riêng theo từng sheet, ưu tiên hơn nhãn dùng chung ở trên (tránh nhầm lẫn
   khi cùng 1 tên cột nhưng ý nghĩa khác nhau ở mỗi sheet, vd trang_thai) */
const LABEL_OVERRIDES = {
  lichsu_congcu: { trang_thai: "Trạng thái sửa chữa" },
  cong_cu: { gia_tri: "Giá trị tài sản (VNĐ)" }
};
const L = (k, sheet) => (sheet && LABEL_OVERRIDES[sheet] && LABEL_OVERRIDES[sheet][k]) || LABELS[k] || k;

/* Nhóm nào (cột nhom trong sheet danh_muc) được coi là "Quà tặng/Đồng phục"?
   Dữ liệu thực tế: nhom là mã CỐ ĐỊNH riêng biệt (CCDC, TSCD, QT, DP...),
   không có tiền tố chung -> whitelist theo tiền tố (bản trước) sai với DP.
   Đổi sang BLACKLIST: loại trừ 2 nhóm chắc chắn KHÔNG PHẢI quà tặng (CCDC =
   công cụ dụng cụ, TSCD = tài sản cố định, vốn được dùng ở nơi khác trong
   app - sheet cong_cu/thongso_kythuat). Bất kỳ mã nhom nào KHÁC 2 mã này
   (QT, DP, hoặc nhóm mới thêm sau này như quà Tết, quà sinh nhật...) đều tự
   động được xem là quà tặng/đồng phục - không cần sửa code khi thêm nhóm mới,
   chỉ cần sửa mảng này nếu sau này có thêm nhóm KHÔNG PHẢI quà tặng khác. */
const KHONG_PHAI_QUA_TANG_NHOM = ["CCDC","TSCD"];
function isQuaTangNhom(nhom){
  return !KHONG_PHAI_QUA_TANG_NHOM.includes(String(nhom||"").trim().toUpperCase());
}

/* ---------- cấu hình các module (sheet) ---------- */
const CONFIG = {
  tong_quan: {
    label:"Tổng quan", desc:"Bức tranh tổng thể về nhân sự và công cụ dụng cụ",
    icon:iconChart(), isOverview:true
  },
  nhan_vien: {
    label:"Nhân sự", desc:"Danh sách nhân sự toàn công ty",
    icon:iconPeople(), pk:["nhanvien_ma"],
    table:["nhanvien_ma","nhanvien_ten","phongban_ma","chuc_vu","phone","trang_thai","tinh_trang"],
    sections:[

/* ---------- gọi API bằng fetch() ----------
   TRƯỚC ĐÂY: dùng JSONP (thẻ <script src="...">) để né lỗi CORS khi mở file
   index.html trực tiếp bằng double-click (file://). NAY: Apps Script tự phục
   vụ luôn cả giao diện này (deploy /exec), nên trang web và API cùng 1 origin
   — không còn lý do kỹ thuật nào để dùng JSONP nữa. fetch() cho code gọn hơn,
   báo lỗi mạng/HTTP rõ ràng hơn và không phải chờ hết timeout 15-25s mới biết
   là lỗi. (Nếu ai đó vẫn mở file bằng double-click, app sẽ báo lỗi kết nối rõ
   ràng ngay, thay vì âm thầm treo.) */
function apiUrlOk(){ return API_URL && /^https?:\/\//i.test(API_URL); }

async function apiGet(action, params, timeoutMs){
  if(!apiUrlOk()){
    const err = new Error("API_URL đang bị lỗi/rỗng (kiểm tra lại dòng const API_URL ở đầu file). Vui lòng dán lại nguyên văn link /exec.");
    err.isNetworkError = true;
    throw err;
  }
  const qs = Object.entries({ ...params, action })
    .filter(([,v])=> v!=null)
    .map(([k,v])=> `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
    .join("&");
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 25000);
  let resp;
  try{
    resp = await fetch(`${API_URL}?${qs}`, { method:"GET", signal: controller.signal });
  }catch(e){
    const err = new Error(e.name === "AbortError"
      ? "Yêu cầu quá thời gian chờ (server không phản hồi). Vui lòng thử lại."
      : "Không kết nối được tới máy chủ. Kiểm tra: (1) đường link API_URL đã đúng bản triển khai mới nhất, (2) quyền truy cập deployment là \"Bất kỳ ai\", (3) kết nối mạng.");
    err.isNetworkError = true;
    throw err;
  }finally{ clearTimeout(timer); }
  if(!resp.ok){
    const err = new Error("Máy chủ trả về lỗi HTTP " + resp.status);
    err.isNetworkError = true;
    throw err;
  }
  return resp.json();
}

async function apiPost(body, timeoutMs){
  if(!apiUrlOk()){
    const err = new Error("API_URL đang bị lỗi/rỗng (kiểm tra lại dòng const API_URL ở đầu file).");
    err.isNetworkError = true;
    throw err;
  }
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs || 25000);
  let resp;
  try{
    resp = await fetch(API_URL, { method:"POST", body: JSON.stringify(body), signal: controller.signal });
  }catch(e){
    const err = new Error(e.name === "AbortError"
      ? "Yêu cầu quá thời gian chờ (server không phản hồi). Vui lòng thử lại."
      : "Không kết nối được tới máy chủ. Kiểm tra kết nối mạng và bản triển khai deployment.");
    err.isNetworkError = true;
    throw err;
  }finally{ clearTimeout(timer); }
  if(!resp.ok){
    const err = new Error("Máy chủ trả về lỗi HTTP " + resp.status);
    err.isNetworkError = true;
    throw err;
  }
  return resp.json();
}

/* ---------- mật khẩu chỉnh sửa (phân quyền xem / sửa đơn giản) ----------
   Nếu quản trị viên đã đặt EDIT_PASSWORD ở phía Code.gs, mọi thao tác
   Thêm/Sửa/Xoá/Tải ảnh sẽ bị máy chủ từ chối (authError:true) cho tới khi
   người dùng nhập đúng mật khẩu. Mật khẩu được hỏi 1 lần, lưu tạm trong
   sessionStorage (mất khi đóng tab) và tự đính kèm vào mọi yêu cầu ghi. */
function getEditPassword(){ return sessionStorage.getItem("hcns_edit_pw") || ""; }
function setEditPassword(pw){ sessionStorage.setItem("hcns_edit_pw", pw || ""); }
function promptEditPassword(message){
  const pw = window.prompt(message || "Khu vực này yêu cầu mật khẩu chỉnh sửa. Vui lòng nhập mật khẩu:");
  if(pw != null) setEditPassword(pw.trim());
  return pw != null;
}

/* ---------- helpers gọi API ---------- */
async function apiList(sheet){
  if(dataCache[sheet]) return dataCache[sheet];
  const json = await apiGet("list", { sheet });
  if(!json.success) throw new Error(json.message || "Lỗi tải dữ liệu");
  dataCache[sheet] = json.data;
  return json.data;
}
/* Sinh mã kế tiếp HOÀN TOÀN Ở PHÍA TRÌNH DUYỆT, không gọi server (action=nextcode
   trước đây phải chờ round-trip mạng mỗi lần bấm "Thêm mới"). Vì mọi màn hình đều
   đã gọi apiList(sheet) để tải dữ liệu trước khi mở form, danh sách bản ghi cần
   thiết để tính mã kế tiếp ĐÃ CÓ SẴN trong dataCache — tính ngay tại chỗ, không
   còn độ trễ nào, kể cả lần thêm mới đầu tiên (chỉ tốn 1 lần tải sheet như cũ, dùng
   lại cache cho các lần sau). Logic giữ nguyên tiền tố chữ + độ dài số đệm, y hệt
   hàm _nextCode() bên Code.gs, để không lệch giữa 2 bên khi backend còn được các
   ứng dụng khác gọi trực tiếp qua JSONP. */
function nextCodeFromRows(rows, field){
  let maxNum = -1, prefix = "", width = 1;
  rows.forEach(r=>{
    const v = String(r[field] ?? "").trim();
    const m = v.match(/^([^\d]*)(\d+)$/);
    if(m){
      const num = parseInt(m[2], 10);
      if(num > maxNum){ maxNum = num; prefix = m[1]; width = m[2].length; }
    }
  });
  if(maxNum === -1) return null;
  const nextNum = maxNum + 1;
  const nextStr = String(nextNum);
  return prefix + nextStr.padStart(Math.max(width, nextStr.length), "0");
}
async function apiFetchNextCode(sheet, fieldOverride){
  try{
    const field = fieldOverride || (CONFIG[sheet] && CONFIG[sheet].pk && CONFIG[sheet].pk[0]);
    if(!field) return null;
    const rows = await apiList(sheet); // cache-first: chỉ tải mạng nếu chưa có sẵn
    return nextCodeFromRows(rows, field);
  }catch(e){ return null; }
}
/* apiWriteRemote: gọi tới Apps Script bằng POST JSON (create/update/delete).
   - Lỗi MẠNG (không tới được server) -> ném Error có .isNetworkError = true.
   - Lỗi mật khẩu (authError) -> hỏi lại mật khẩu 1 lần rồi tự thử lại.
   - Lỗi LOGIC khác (trùng mã, dữ liệu không hợp lệ...) -> ném Error thường. */
async function apiWriteRemote(action, sheet, payload, _isRetry){
  const body = { action, sheet, editPassword: getEditPassword() };
  if(payload && payload.id != null) body.id = payload.id;
  if(payload && payload.data != null) body.data = payload.data;
  const json = await apiPost(body);
  if(!json.success){
    if(json.authError && !_isRetry){
      const entered = promptEditPassword(json.message);
      if(entered) return apiWriteRemote(action, sheet, payload, true);
    }
    throw new Error(json.message || "Thao tác thất bại");
  }
  return json;
}

/* ================= HÀNG ĐỢI ĐỒNG BỘ NGẦM (offline-first) =================
   Thêm/Sửa/Xoá được áp dụng NGAY vào dữ liệu đang hiển thị (optimistic UI),
   đồng thời xếp vào hàng đợi lưu trong localStorage và đồng bộ ngầm lên
   Google Sheet ở nền — người dùng không phải chờ máy chủ phản hồi.
   - Lỗi MẠNG: giữ nguyên hàng đợi, tự thử lại sau vài giây.
   - Lỗi LOGIC (vd trùng mã, thiếu dữ liệu): tự hoàn tác thay đổi cục bộ,
     bỏ khỏi hàng đợi và báo lỗi cho người dùng.
   ============================================================================ */
const SYNC_QUEUE_KEY = "hcns_sync_queue_v1";
let syncQueue = loadSyncQueue();
dedupSyncQueue();
persistSyncQueue();
let isSyncing = false;
let syncRetryTimer = null;

function loadSyncQueue(){
  try{ return JSON.parse(localStorage.getItem(SYNC_QUEUE_KEY) || "[]"); }catch(e){ return []; }
}
/* Nếu hàng đợi có nhiều thao tác giống HỆT nhau (cùng action, cùng sheet,
   cùng id, cùng dữ liệu data) — ví dụ do bấm Lưu nhiều lần liên tiếp, hoặc
   cùng 1 bản ghi được sửa lại về đúng giá trị đã xếp hàng trước đó — thì chỉ
   cần đồng bộ 1 lần, các bản trùng còn lại không đóng góp gì thêm nên được
   xoá bớt. Giữ lại bản xuất hiện SỚM NHẤT để không đổi thứ tự xử lý ban đầu. */
function dedupSyncQueue(){
  const seen = new Set();
  const result = [];
  syncQueue.forEach(op=>{
    const key = [op.action, op.sheet, op.id ?? "", JSON.stringify(op.data || null)].join("||");
    if(seen.has(key)) return; // trùng -> bỏ qua, không đẩy vào kết quả
    seen.add(key);
    result.push(op);
  });
  syncQueue = result;
}
function persistSyncQueue(){
  try{ localStorage.setItem(SYNC_QUEUE_KEY, JSON.stringify(syncQueue)); }catch(e){ /* ignore quota */ }
  renderSyncBadge();
}
function renderSyncBadge(){
  let badge = document.getElementById("syncBadge");
  if(!badge){
    badge = document.createElement("div");
    badge.id = "syncBadge";
    badge.style.cssText = "position:fixed;left:16px;bottom:16px;z-index:90;display:none;align-items:center;gap:8px;background:var(--forest-deep);color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;box-shadow:0 8px 20px rgba(0,0,0,.18);cursor:pointer;";
    badge.title = "Bấm để thử đồng bộ lại ngay";

    document.body.appendChild(badge);
  }
  if(!syncQueue.length){ badge.style.display = "none"; return; }
  badge.style.display = "inline-flex";
  badge.innerHTML = isSyncing
    ? `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="spin"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v4h4"/></svg> Đang đồng bộ ${syncQueue.length} thay đổi…`
    : `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg> ${syncQueue.length} thay đổi chờ đồng bộ — bấm để thử lại`;

/* Xếp 1 thao tác ghi (create/update/delete) vào hàng đợi và áp dụng ngay vào
   dữ liệu đang hiển thị (optimistic). sheet/id/data theo đúng định dạng gửi
   lên API. optimisticFn là hàm chỉnh sửa dataCache[sheet] tại chỗ. */
function queueOperation(action, sheet, id, data, optimisticFn){
  const snapshot = dataCache[sheet] ? JSON.parse(JSON.stringify(dataCache[sheet])) : null;
  if(optimisticFn) optimisticFn();
  syncQueue.push({ opId: Date.now()+"_"+Math.random().toString(36).slice(2), action, sheet, id, data, snapshot });
  dedupSyncQueue();
  persistSyncQueue();
  processSyncQueue();
}

async function processSyncQueue(){
  if(isSyncing || !syncQueue.length) return;
  dedupSyncQueue();
  isSyncing = true;
  renderSyncBadge();
  if(syncRetryTimer){ clearTimeout(syncRetryTimer); syncRetryTimer = null; }

  while(syncQueue.length){
    const op = syncQueue[0];
    try{
      const payload = op.action === "delete" ? { id: op.id }
        : op.action === "update" ? { id: op.id, data: op.data }
        : { data: op.data };
      await apiWriteRemote(op.action, op.sheet, payload);
      syncQueue.shift();
      persistSyncQueue();
      // hết thao tác đang chờ cho sheet này -> nạp lại dữ liệu chuẩn từ máy chủ
      if(!syncQueue.some(o=>o.sheet===op.sheet)){
        delete dataCache[op.sheet];
        refreshCounts();
        if(currentSheet===op.sheet) loadTable();
      }
    }catch(err){
      if(err.isNetworkError){
        isSyncing = false;
        renderSyncBadge();
        syncRetryTimer = setTimeout(processSyncQueue, 8000);
        return;
      }
      // lỗi logic (trùng mã, thiếu dữ liệu...) -> hoàn tác thay đổi cục bộ
      if(op.snapshot) dataCache[op.sheet] = op.snapshot; else delete dataCache[op.sheet];
      toast(`Đồng bộ thất bại, đã hoàn tác: ${err.message}`, true);
      syncQueue.shift();
      persistSyncQueue();
      refreshCounts();
      if(currentSheet===op.sheet) loadTable();
    }
  }
  isSyncing = false;
  renderSyncBadge();
}

function idOf(row, pk){ return pk.map(f=>row[f] ?? "").join("|"); }

function toast(msg, isError, retryFn){
  const wrap = document.getElementById("toast-wrap");
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.innerHTML = (isError
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 12l5 5L20 6"/></svg>`
  ) + `<span style="flex:1;">${msg}</span>`;
  if(retryFn){
    const retryBtn = document.createElement("button");
    retryBtn.textContent = "Thử lại";
    retryBtn.style.cssText = "border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;flex:none;";
    retryBtn.onclick = ()=>{ el.remove(); retryFn(); };
    el.appendChild(retryBtn);
  }
  wrap.appendChild(el);
  // lỗi có nút thử lại thì để lâu hơn (8s) thay vì tự biến mất nhanh (2.6s)
  const life = retryFn ? 8000 : 2600;
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .25s"; setTimeout(()=>el.remove(),250); }, life);
}

/* ---------- quản lý đóng overlay khi click ra ngoài ----------
   Nếu có nhiều overlay đang mở (vd panel chi tiết + hộp thoại xác nhận),
   mỗi lần click ra ngoài chỉ đóng overlay đang ở trên cùng (mở gần nhất). */
let overlayStack = [];
function pushOverlay(id){ overlayStack = overlayStack.filter(x=>x!==id); overlayStack.push(id); }
function popOverlay(id){ overlayStack = overlayStack.filter(x=>x!==id); }
function setupOverlayOutsideClick(id, closeFn){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener("mousedown", (e)=>{
    if(e.target !== el) return; // chỉ tính click vào nền, không tính click vào nội dung bên trong
    if(overlayStack.length && overlayStack[overlayStack.length-1] !== id) return; // chỉ đóng overlay trên cùng
    closeFn();
  });
}

async function applyFilter(rows){
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let base = activeFilter ? rows.filter(activeFilter.predicate) : rows.slice();

  let nvMap = null;
  if((currentSheet === "cong_cu" || currentSheet === "qua_tang") && quickFilters.phongban_ma){
    const nvRows = await apiList("nhan_vien");
    nvMap = {}; nvRows.forEach(n => nvMap[n.nhanvien_ma] = n);
  }

  Object.entries(quickFilters).forEach(([field, val])=>{
    if(!val) return;
    if(field === "phongban_ma" && nvMap){
      base = base.filter(r => { const nv = nvMap[r.nhanvien_ma]; return nv && String(nv.phongban_ma) === String(val); });
    }else{
      base = base.filter(r => String(r[field] ?? "") === String(val));
    }
  });

  filtered = !q ? base : base.filter(r =>
    Object.values(r).some(v => v!=null && String(v).toLowerCase().includes(q))
  );
  applySort();
  renderTable();
}

/* ---------- sắp xếp cột trên bảng danh sách ---------- */
function applySort(){
  const s = sortState[currentSheet];
  if(!s || !s.field) return;
  const { field, dir } = s;
  const mul = dir === "desc" ? -1 : 1;
  filtered = filtered.slice().sort((a,b)=>{
    let va = a[field], vb = b[field];
    // ngày dd/mm/yyyy -> so theo giá trị thời gian thực, số -> so theo số,
    // còn lại so theo chuỗi (không phân biệt hoa/thường)
    if(DATE_FIELDS_HINT(field)){
      va = vnToIso(va) || ""; vb = vnToIso(vb) || "";
    }else if(NUMBER_FIELDS.has(field)){
      const na = Number(String(va ?? "").replace(/[^\d.-]/g,"")), nb = Number(String(vb ?? "").replace(/[^\d.-]/g,""));
      if(!isNaN(na) && !isNaN(nb)){ va = na; vb = nb; }
    }
    if(va == null || va === "") return 1;
    if(vb == null || vb === "") return -1;
    if(va < vb) return -1 * mul;
    if(va > vb) return 1 * mul;
    return 0;
  });
}
function toggleSort(field){
  const cur = sortState[currentSheet];
  let dir = "asc";
  if(cur && cur.field === field) dir = cur.dir === "asc" ? "desc" : (cur.dir === "desc" ? null : "asc");
  sortState[currentSheet] = dir ? { field, dir } : null;
  applySort();
  page = 1;
  renderTable();
}

/* xây thanh bộ lọc nhanh theo cột (dropdown), hiển thị giá trị dạng tên nếu có quan hệ */
function buildFilterBarHtml(cfg, relMaps, extraOptions){
  extraOptions = extraOptions || {};
  if(!cfg.filters || !cfg.filters.length) return "";
  const allRows = dataCache[currentSheet] || [];
  const controls = cfg.filters.map(f=>{
    let opts;
    if(extraOptions[f]){
      opts = extraOptions[f];
    }else if(relMaps[f]){
      const seen = new Set();
      opts = allRows.map(r=>r[f]).filter(v=> v!=null && v!=="" && !seen.has(v) && seen.add(v))
        .map(v=>({ value:v, text: relMaps[f][v] || v }))
        .sort((a,b)=> String(a.text).localeCompare(String(b.text)));
    }else{
      opts = distinctValues(allRows, f, 60).map(v=>({ value:v, text:v }));
    }
    if(!opts.length) return "";
    const cur = quickFilters[f] || "";
    return `<select data-qf="${f}">
      <option value="">${L(f, currentSheet)} — Tất cả</option>
      ${opts.map(o=>`<option value="${escAttr(o.value)}" ${String(o.value)===String(cur)?"selected":""}>${o.text}</option>`).join("")}
    </select>`;
  }).join("");
  return controls ? `<div class="filter-bar">${controls}</div>` : "";
}

/* ---------- tên công cụ: lấy cột cong_cu_ten, nếu trống thì ghép từ thông số kỹ thuật ---------- */
const CONG_CU_TEN_ATTR_ORDER = ["TT000001","TT000002","TT000008","TT000009","TT000010"];
function computeCongCuTen(row, specRows){
  if(row.cong_cu_ten != null && String(row.cong_cu_ten).trim() !== "") return row.cong_cu_ten;
  const mine = specRows.filter(s => s.cong_cu_ma === row.cong_cu_ma);
  const byAttr = {};
  mine.forEach(s => { byAttr[s.thuoc_tinh_ma] = s.gia_tri; });
  const parts = CONG_CU_TEN_ATTR_ORDER.map(code => byAttr[code]).filter(v => v!=null && String(v).trim()!=="");
  return parts.length ? parts.join(" ") : row.cong_cu_ma;
}

/* ================= THÔNG SỐ KỸ THUẬT CÔNG CỤ (sheet thongso_kythuat) =================
   Liên kết qua cột cong_cu_ma (thongso_kythuat.cong_cu_ma <-> cong_cu.cong_cu_ma),
   khoá chính ghép [cong_cu_ma, thuoc_tinh_ma]. Dùng chung 1 bộ hàm cho cả 3 nơi:
   form Thêm/Sửa công cụ (openForm) và tab "Thông số kỹ thuật" ở panel chi tiết
   (openRecordPanel) — cho phép xem/thêm/sửa/xoá ngay tại chỗ, không cần điều
   hướng sang màn hình khác. ==================================================== */
let ttRows = [];   // các dòng thông số đang soạn (đang mở form/tab nào thì dùng biến này)
let ttRowSeq = 0;

async function loadTtRowsForCongCu(congCuMa){
  ttRows = []; ttRowSeq = 0;
  if(!congCuMa) return;
  const [specRows, attrRows] = await Promise.all([apiList("thongso_kythuat"), apiList("thuoc_tinh")]);
  const tenMap = {}; attrRows.forEach(a => { tenMap[a.thuoc_tinh_ma] = a.thuoc_tinh_ten; });
  specRows.filter(s => s.cong_cu_ma === congCuMa).forEach(s => {
    ttRows.push({ id: ++ttRowSeq, thuoc_tinh_ma: s.thuoc_tinh_ma, thuoc_tinh_ten: tenMap[s.thuoc_tinh_ma] || s.thuoc_tinh_ma, gia_tri: s.gia_tri || "", _existing: true });
  });
}
function getTtRow(id){ return ttRows.find(r=>r.id===id); }

/* Đồng bộ (thêm/sửa/xoá) toàn bộ dòng thông số kỹ thuật của 1 công cụ lên sheet
   thongso_kythuat, xếp qua hàng đợi đồng bộ ngầm giống các thao tác khác. So sánh
   ttRows hiện tại với các dòng "_existing" (đã có sẵn từ trước) để biết dòng nào
   cần xoá (bị bỏ khỏi bảng), dòng nào cần thêm mới, dòng nào cần cập nhật. */
function syncTtRowsForCongCu(congCuMa){
  if(!congCuMa) return;
  const sheet = "thongso_kythuat";
  const pk = ["cong_cu_ma","thuoc_tinh_ma"];
  const validRows = ttRows.filter(r=>r.thuoc_tinh_ma);
  const keptMa = new Set(validRows.map(r=>r.thuoc_tinh_ma));
  ttRows.filter(r=>r._existing && !keptMa.has(r.thuoc_tinh_ma)).forEach(r=>{
    const id = `${congCuMa}|${r.thuoc_tinh_ma}`;
    queueOperation("delete", sheet, id, null, ()=>{
      if(dataCache[sheet]) dataCache[sheet] = dataCache[sheet].filter(x=>idOf(x,pk)!==id);
    });
  });
  validRows.forEach(r=>{
    const id = `${congCuMa}|${r.thuoc_tinh_ma}`;
    const rowData = { cong_cu_ma: congCuMa, thuoc_tinh_ma: r.thuoc_tinh_ma, gia_tri: r.gia_tri || "" };
    const action = r._existing ? "update" : "create";
    queueOperation(action, sheet, action==="update" ? id : null, rowData, ()=>{
      if(!dataCache[sheet]) dataCache[sheet] = [];
      const idx = dataCache[sheet].findIndex(x=>idOf(x,pk)===id);
      if(idx>-1) dataCache[sheet][idx] = { ...dataCache[sheet][idx], ...rowData };
      else dataCache[sheet] = [...dataCache[sheet], rowData];
    });
  });
}

/* Chuẩn hoá mã để so khớp bất kể số 0 đệm khác nhau (vd "CCDC04" và
   "CCDC00004" cùng trỏ tới 1 danh mục nhưng độ dài số khác nhau do được
   nhập tay ở các thời điểm khác nhau). Tách phần chữ (tiền tố) và phần số,
   rồi so theo giá trị số thực (bỏ số 0 đệm ở đầu). */
function normalizeCodeKey(v){
  const s = String(v==null?"":v).trim().toUpperCase();
  const m = s.match(/^([^\d]*)(\d+)$/);
  if(m) return m[1] + parseInt(m[2], 10);
  return s;
}

async function relationMap(relCfg){
  const rows = await apiList(relCfg.sheet);
  // LƯU Ý: hàm này build bản đồ mã->tên để HIỂN THỊ (bảng, panel chi tiết...),
  // nên KHÔNG áp dụng relCfg.filter ở đây — filter chỉ nên dùng để thu hẹp
  // DANH SÁCH CHỌN khi thêm mới (xem openForm/openRelPicker), không phải để
  // giới hạn việc tra tên. Nếu lọc ở đây, mã nào không khớp filter (ví dụ do
  // sau này đổi/thêm nhóm mới) sẽ chỉ hiện mã thô thay vì tên — đúng lỗi đã
  // gặp với "DP0000001". Luôn build đầy đủ để tra tên chính xác dù thuộc nhóm nào.
  const map = {};
  rows.forEach(r => {
    map[r[relCfg.value]] = r[relCfg.text];
    map[String(r[relCfg.value]||"").trim()] = r[relCfg.text];
    map[normalizeCodeKey(r[relCfg.value])] = r[relCfg.text];
  });
  return map;
}

/* Tìm quan hệ (nếu có) mà field này là đích autofill, vd "danh_muc_cha_ten"
   được tự động điền từ quan hệ "danh_muc_cha". Dùng cho các trường chỉ đọc,
   tự động nạp theo khoá ngoại đang chọn, không cho gõ tay. */
function findAutofillRelation(sheet, field){
  const cfg = CONFIG[sheet];
  for(const [srcField, relCfg] of Object.entries(cfg.relations || {})){
    if(relCfg.autofill && Object.prototype.hasOwnProperty.call(relCfg.autofill, field)){
      return { srcField, relCfg, srcKey: relCfg.autofill[field] };
    }
  }
  return null;
}
/* Tính giá trị hiển thị cho 1 trường chỉ-đọc/tự-động (vd Tên danh mục cha)
   dựa trên giá trị hiện tại của khoá ngoại nguồn (vd danh_muc_cha), so khớp
   không phân biệt khoảng trắng thừa và số 0 đệm khác nhau giữa 2 mã. */
async function autofillDisplayValue(sheet, field, record){
  const info = findAutofillRelation(sheet, field);
  const fallback = record && record[field] != null ? record[field] : "";
  if(!info) return fallback;
  const srcVal = record ? record[info.srcField] : null;
  if(srcVal == null || srcVal === "") return fallback;
  const rows = await apiList(info.relCfg.sheet);
  const list = info.relCfg.filter ? rows.filter(info.relCfg.filter) : rows;
  const key = String(srcVal).trim();
  const normKey = normalizeCodeKey(srcVal);
  const found = list.find(r => String(r[info.relCfg.value] ?? "").trim() === key)
    || list.find(r => normalizeCodeKey(r[info.relCfg.value]) === normKey);
  return found ? (found[info.srcKey] ?? fallback) : fallback;
}

/* ================= XUẤT EXCEL (đầy đủ số liệu, không chỉ các cột đang hiển thị) =================
   Xuất TOÀN BỘ cột gốc có trong sheet (kể cả cột không nằm trong cfg.table hiển thị
   ở bảng danh sách), cộng thêm các cột "Tên" tra theo khoá ngoại (vd phongban_ma ->
   Phòng ban (Tên)) và các cột số liệu tổng hợp/join thêm đang được tính toán ở nơi
   khác trong app (vd Tên công cụ tổng hợp từ thông số kỹ thuật, Phòng ban theo
   người đang giữ công cụ...), để người xem file Excel có đủ ngữ cảnh mà không cần
   mở lại nhiều sheet để tra cứu chéo. */
async function buildExportDataForSheet(sheet, rowsInput){
  const cfg = CONFIG[sheet];
  const rows = rowsInput && rowsInput.length ? rowsInput : (dataCache[sheet] || await apiList(sheet));

  const rawFields = [];
  const seenField = new Set();
  rows.forEach(r => Object.keys(r).forEach(k => {
    if(k === "_row" || seenField.has(k)) return;
    seenField.add(k); rawFields.push(k);
  }));

  // bản đồ mã -> tên cho mọi trường có khai báo quan hệ (relations) của sheet này
  const relMaps = {};
  for(const [field, relCfg] of Object.entries(cfg.relations || {})){
    relMaps[field] = await relationMap(relCfg);
  }

  // cột tính toán/join thêm đặc thù theo từng sheet (không phải cột gốc trong Google
  // Sheet nhưng là số liệu liên quan trực tiếp, đã được dùng để hiển thị nơi khác)
  const extraCols = [];
  if(sheet === "cong_cu"){
    const [specRows, nvRows] = await Promise.all([apiList("thongso_kythuat"), apiList("nhan_vien")]);
    const pbMap = await relationMap({ sheet:"phong_ban", value:"phongban_ma", text:"phongban_ten" });
    const nvByMa = {}; nvRows.forEach(n => nvByMa[n.nhanvien_ma] = n);
    extraCols.push({ label:"Tên công cụ (tổng hợp)", fn: r => computeCongCuTen(r, specRows) });
    extraCols.push({ label:"Phòng ban (theo người đang giữ)", fn: r => { const nv = nvByMa[r.nhanvien_ma]; return nv ? (pbMap[nv.phongban_ma] || "") : ""; } });
  }
  if(sheet === "qua_tang"){
    const nvRows = await apiList("nhan_vien");
    const pbMap = await relationMap({ sheet:"phong_ban", value:"phongban_ma", text:"phongban_ten" });
    const nvByMa = {}; nvRows.forEach(n => nvByMa[n.nhanvien_ma] = n);
    extraCols.push({ label:"Phòng ban", fn: r => { const nv = nvByMa[r.nhanvien_ma]; return nv ? (pbMap[nv.phongban_ma] || "") : ""; } });
  }
  if(sheet === "danhmuc_chitiet"){
    const dmMap = await relationMap({ sheet:"danh_muc", value:"danh_muc_ma", text:"danh_muc_ten" });
    extraCols.push({ label:"Tên danh mục cha", fn: r => dmMap[r.danh_muc_cha] || dmMap[normalizeCodeKey(r.danh_muc_cha)] || "" });
  }
  if(sheet === "thuoc_tinh"){
    const dmMap = await relationMap({ sheet:"danhmuc_chitiet", value:"danh_muc_ma", text:"danh_muc_ten" });
    extraCols.push({ label:"Tên danh mục", fn: r => dmMap[r.danh_muc_ma] || dmMap[normalizeCodeKey(r.danh_muc_ma)] || "" });
  }
  if(sheet === "lichsu_congcu"){
    const [specRows, ccRows] = await Promise.all([apiList("thongso_kythuat"), apiList("cong_cu")]);
    const ccByMa = {}; ccRows.forEach(c => ccByMa[c.cong_cu_ma] = c);
    extraCols.push({ label:"Tên công cụ", fn: r => { const cc = ccByMa[r.cong_cu_ma]; return cc ? computeCongCuTen(cc, specRows) : ""; } });
  }

  return rows.map(r => {
    const obj = {};
    rawFields.forEach(f => {
      const rawVal = r[f];
      obj[L(f, sheet)] = rawVal == null ? "" : (NUMBER_FIELDS.has(f) ? (Number(String(rawVal).replace(/[^\d.-]/g,"")) || rawVal) : rawVal);
      if(relMaps[f]){
        const resolved = relMaps[f][rawVal] || relMaps[f][normalizeCodeKey(rawVal)] || "";
        obj[`${L(f, sheet)} (Tên)`] = resolved;
      }
    });
    extraCols.forEach(c => { obj[c.label] = c.fn(r) || ""; });
    return obj;
  });
}

/* Tự tính độ rộng cột Excel theo nội dung dài nhất trong từng cột (kể cả tiêu đề),
   để khi mở file không phải tự kéo giãn từng cột. Giới hạn tối thiểu/tối đa để
   tránh cột quá hẹp (số ngắn) hoặc quá rộng (ghi chú dài). */
function excelAutoFitCols(rows){
  if(!rows || !rows.length) return [];
  const keys = Object.keys(rows[0]);
  return keys.map(key=>{
    let maxLen = String(key).length;
    rows.forEach(r=>{
      const v = r[key];
      if(v==null || v==="") return;
      const len = String(v).length;
      if(len>maxLen) maxLen = len;
    });
    return { wch: Math.min(60, Math.max(10, maxLen + 2)) };
  });
}

async function exportListToExcel(){

    let exportRows;

      const source = (filtered && filtered.length) ? filtered : (dataCache[sheet] || await apiList(sheet));
      exportRows = await buildExportDataForSheet(sheet, source);
    }
    if(!exportRows.length){ toast("Không có dữ liệu để xuất", true); return; }
    const ws = XLSX.utils.json_to_sheet(exportRows);
    ws['!cols'] = excelAutoFitCols(exportRows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, String(cfg.label).slice(0,31));
    XLSX.writeFile(wb, `${sheet}_${stamp}.xlsx`);
    toast("Đã xuất file Excel thành công");
  }catch(err){
    toast("Xuất Excel thất bại: " + err.message, true);
  }finally{
    btn.disabled = false;
  }
}

/* ---------- distinct values (gợi ý datalist) ---------- */
function distinctValues(rows, field, max=25){
  const set = new Set();
  rows.forEach(r=>{ if(r[field]!=null && r[field]!=="") set.add(String(r[field])); });
  return set.size<=max ? [...set].sort() : [];
}

const HIDDEN_IN_VIEW_FIELDS = new Set(["photo_url","hoadon_url"]);
const DATE_FIELDS_HINT = f => f.startsWith("ngay_") || f==="han_bao_hanh";
const NUMBER_FIELDS = new Set(["chi_phi_sua","gia_tri"]);
/* chuyển link chia sẻ Google Drive (dạng .../file/d/ID/view) sang link ảnh xem trực tiếp,
   để tránh trường hợp ảnh hoá đơn hiện trắng do không phải link ảnh trực tiếp */
function driveDirectLink(url){
  if(!url) return url;
  const m = String(url).match(/drive\.google\.com\/file\/d\/([^/]+)/) || String(url).match(/[?&]id=([^&]+)/);
  // dùng endpoint "thumbnail" của Drive: ổn định hơn "uc?export=view" khi nhúng trực tiếp
  // trong thẻ <img> (yêu cầu file chia sẻ ở chế độ "Bất kỳ ai có đường liên kết")
  if(m && m[1]) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w1000`;
  return url;
}
function formatNumber(v){
  if(v==null || v==="") return v;
  const n = Number(String(v).replace(/[^\d.-]/g,""));
  if(isNaN(n)) return v;
  return n.toLocaleString("vi-VN");
}
/* chuyển dd/mm/yyyy (định dạng lưu trong Google Sheet) <-> yyyy-mm-dd (input type=date) */
function vnToIso(d){
  if(!d) return "";
  const m = String(d).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return "";
  return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}
function isoToVn(d){
  if(!d) return "";
  const m = String(d).trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return d;
  return `${m[3]}/${m[2]}/${m[1]}`;
}

/* ================= TẢI ẢNH LÊN GOOGLE DRIVE =================
   Dùng cho mọi trường kiểu URL_FIELDS (photo_url của nhân sự/công cụ,
   hoadon_url của lịch sử công cụ): cho phép "Chọn ảnh" từ máy hoặc
   "Chụp ảnh" trực tiếp bằng camera, tự nén ảnh bớt kích thước ở trình
   duyệt trước khi gửi lên, backend lưu vào thư mục Drive rồi trả về link
   chia sẻ, tự điền vào ô link tương ứng.
   LƯU Ý: thao tác này gọi bằng fetch() POST (không qua JSONP như các thao
   tác CRUD khác) vì ảnh base64 quá lớn để nhét vào URL của thẻ <script>.
   Vì vậy chỉ dùng được khi mở app qua link /exec đã triển khai (không phải
   khi mở file index.html bằng double-click) — điều này hợp lý vì tải ảnh
   lên Google Drive vốn dĩ luôn cần có kết nối mạng. ============================= */
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(",")[1] || "");
    reader.onerror = ()=> reject(new Error("Không đọc được file đã chọn"));
    reader.readAsDataURL(file);
  });
}
/* nén/giảm kích thước ảnh ở trình duyệt trước khi gửi lên (ảnh chụp trực
   tiếp từ camera điện thoại thường rất nặng, vài MB đến chục MB) */
function resizeImageForUpload(file, maxDim, quality){
  maxDim = maxDim || 1600; quality = quality || 0.82;
  return new Promise((resolve)=>{
    if(!file || !String(file.type||"").startsWith("image/")){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
          else { width = Math.round(width * maxDim/height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob=>{
          if(!blob){ resolve(file); return; }
          const newName = (file.name || "anh").replace(/\.\w+$/,"") + ".jpg";
          resolve(new File([blob], newName, { type:"image/jpeg" }));
        }, "image/jpeg", quality);
      };
      img.onerror = ()=> resolve(file);
      img.src = reader.result;
    };
    reader.onerror = ()=> resolve(file);
    reader.readAsDataURL(file);
  });
}
async function apiUploadImage(file, _isRetry){
  const resized = await resizeImageForUpload(file);
  const base64 = await fileToBase64(resized);
  const json = await apiPost({ action:"uploadimage", filename: resized.name, mimeType: resized.type, base64, editPassword: getEditPassword() });
  if(!json.success){
    if(json.authError && !_isRetry){
      const entered = promptEditPassword(json.message);
      if(entered) return apiUploadImage(file, true);
    }
    throw new Error(json.message || "Tải ảnh lên thất bại");
  }
  return json.data;
}
/* HTML cho 1 khối "trường ảnh": preview + 2 nút (chọn ảnh / chụp ảnh) + ô
   link để vẫn dán tay được nếu cần. attrName là "data-field"/"data-spfield"/
   "data-hfield" tuỳ ngữ cảnh (form thêm-sửa / panel chi tiết / lịch sử). */
function imageFieldBlockHtml(attrName, field, sheet, val, locked){
  const disabledAttr = locked ? "disabled" : "";
  const hasVal = val && String(val).trim() !== "";
  return `<div class="field full img-field" data-field-name="${field}">
    <label>${L(field, sheet)}</label>
    <div class="img-preview" style="${hasVal?"":"display:none;"}"><img src="${hasVal?driveDirectLink(val):""}" onerror="this.parentElement.style.display='none'"></div>
    <div class="img-upload-row">
      <input type="file" accept="image/*" class="img-file-input" style="display:none" ${disabledAttr}>
      <input type="file" accept="image/*" capture="environment" class="img-cam-input" style="display:none" ${disabledAttr}>
      <button type="button" class="btn btn-ghost btn-sm img-browse-btn" ${disabledAttr}>📁 Chọn ảnh</button>
      <button type="button" class="btn btn-ghost btn-sm img-cam-btn" ${disabledAttr}>📷 Chụp ảnh</button>
      <span class="img-upload-status"></span>
    </div>
    <textarea ${attrName}="${field}" class="img-url-textarea" rows="2" style="min-height:38px;font-family:inherit;font-size:11px;" placeholder="hoặc dán link ảnh trực tiếp..." ${disabledAttr}>${val||""}</textarea>
  </div>`;
}
/* gắn sự kiện cho mọi khối .img-field bên trong 1 vùng chứa (form/panel vừa
   render ra) — gọi lại nhiều lần vô hại nhờ cờ data-wired đánh dấu đã gắn */
function wireImageFields(container){
  if(!container) return;
  container.querySelectorAll(".img-field").forEach(wrap=>{
    if(wrap.dataset.wired) return;
    wrap.dataset.wired = "1";
    const fileInput = wrap.querySelector(".img-file-input");
    const camInput = wrap.querySelector(".img-cam-input");
    const browseBtn = wrap.querySelector(".img-browse-btn");
    const camBtn = wrap.querySelector(".img-cam-btn");
    const status = wrap.querySelector(".img-upload-status");
    const textarea = wrap.querySelector(".img-url-textarea");
    const previewBox = wrap.querySelector(".img-preview");
    const previewImg = previewBox ? previewBox.querySelector("img") : null;
    if(browseBtn) browseBtn.onclick = ()=> fileInput.click();
    if(camBtn) camBtn.onclick = ()=> camInput.click();
    async function handleFile(file){
      if(!file) return;
      if(status) status.textContent = "Đang tải lên...";
      if(browseBtn) browseBtn.disabled = true;
      if(camBtn) camBtn.disabled = true;
      try{
        const data = await apiUploadImage(file);
        textarea.value = data.url;
        if(previewImg){ previewImg.src = data.directUrl || driveDirectLink(data.url); }
        if(previewBox) previewBox.style.display = "";
        if(status){ status.textContent = "Đã tải lên ✓"; setTimeout(()=>{ status.textContent=""; }, 2500); }
      }catch(err){
        if(status) status.textContent = "";
        toast("Tải ảnh thất bại: " + err.message, true);
      }finally{
        if(browseBtn) browseBtn.disabled = false;
        if(camBtn) camBtn.disabled = false;
        fileInput.value = ""; camInput.value = "";
      }
    }
    fileInput.onchange = ()=> handleFile(fileInput.files[0]);
    camInput.onchange = ()=> handleFile(camInput.files[0]);
  });
}

/* ---------- form thêm / sửa ---------- */
async function openForm(id){
  editingId = id || null;
  const cfg = CONFIG[currentSheet];
  document.getElementById("formTitle").textContent = editingId ? `Sửa ${cfg.label.toLowerCase()}` : `Thêm ${cfg.label.toLowerCase()}`;

  const rows = await apiList(currentSheet);
  const record = editingId ? rows.find(r=>idOf(r,cfg.pk)===editingId) : {};

  let autoCode = null;
  if(!editingId && AUTO_CODE_SHEETS.includes(currentSheet)){
    autoCode = await apiFetchNextCode(currentSheet);
  }

  // build relation option lists
  const relOptions = {};
  for(const [field, relCfg] of Object.entries(cfg.relations || {})){
    const relRows = await apiList(relCfg.sheet);
    relOptions[field] = (relCfg.filter ? relRows.filter(relCfg.filter) : relRows)
      .map(r=>({ value:r[relCfg.value], text:`${r[relCfg.text]} (${r[relCfg.value]})` }));
  }

  // giá trị cho các trường chỉ đọc / tự động nạp theo khoá ngoại (vd Tên danh mục cha)
  const readonlyValues = {};
  for(const f of (cfg.readOnlyFields || [])){
    readonlyValues[f] = await autofillDisplayValue(currentSheet, f, record);
  }

  const body = document.getElementById("formBody");
  body.innerHTML = cfg.sections.map(sec=>{
    const fieldsHtml = sec.fields.map(f=>{
      const isPk = cfg.pk.includes(f);
      const isLockedPk = isPk && (editingId || AUTO_CODE_SHEETS.includes(currentSheet));
      const val = record && record[f]!=null ? record[f] : (isPk && autoCode ? autoCode : "");
      const rel = (cfg.relations||{})[f];

      if((cfg.readOnlyFields||[]).includes(f)){
        return `<div class="field"><label>${L(f, currentSheet)} <span class="field-hint">(tự động)</span></label>
          <input type="text" data-field="${f}" value="${escAttr(readonlyValues[f] ?? "")}" readonly></div>`;
      }
      if(rel){
        const found = relOptions[f].find(o=>String(o.value)===String(val));
        const displayText = found ? found.text : (val ? String(val) : "");
        if(isLockedPk){
          // khoá chính đồng thời là khoá ngoại (vd nhanvien_ma/ma_qua_tang trong
          // qua_tang) và đang ở chế độ sửa -> không cho nháy đúp đổi giá trị
          return `<div class="field"><label>${L(f, currentSheet)} <span class="field-hint">(khoá chính, không thể đổi)</span></label>
            <input type="hidden" data-field="${f}" value="${escAttr(val)}">
            <input type="text" value="${escAttr(displayText)}" readonly></div>`;
        }
        return `<div class="field"><label>${L(f, currentSheet)}</label>
          <input type="hidden" data-field="${f}" value="${escAttr(val)}">
          <input type="text" data-rel-display="${f}" value="${escAttr(displayText)}" readonly
            placeholder="Nháy đúp để chọn ${L(f, currentSheet).toLowerCase()}"
            ondblclick="openRelFieldPicker('${currentSheet}','${f}', this)">
          <span class="field-hint-dbl">Nháy đúp vào ô để chọn từ danh sách</span></div>`;
      }
      if(LONGTEXT_FIELDS.has(f)){
        return `<div class="field full"><label>${L(f, currentSheet)}</label><textarea data-field="${f}">${val}</textarea></div>`;
      }
      if(URL_FIELDS.has(f)){
        return imageFieldBlockHtml("data-field", f, currentSheet, val, false);
      }
      if(DATE_FIELDS_HINT(f)){
        return `<div class="field"><label>${L(f, currentSheet)}${isPk?' <span class="field-hint">(khoá chính)</span>':''}</label>
          <input type="date" data-field="${f}" data-datefield="1" value="${vnToIso(val)}" ${isLockedPk ? "readonly" : ""}></div>`;
      }
      const listId = `dl_${f}`;
      const options = distinctValues(rows, f);
      const datalist = options.length ? `<datalist id="${listId}">${options.map(o=>`<option value="${o}">`).join("")}</datalist>` : "";
      const pkNote = isPk ? (AUTO_CODE_SHEETS.includes(currentSheet) ? ' <span class="field-hint">(tự sinh)</span>' : ' <span class="field-hint">(khoá chính)</span>') : '';
      return `<div class="field"><label>${L(f, currentSheet)}${pkNote}</label>
        <input type="text" data-field="${f}" value="${escAttr(val)}" ${options.length?`list="${listId}"`:""} ${isLockedPk ? "readonly" : ""}>
        ${datalist}</div>`;
    }).join("");
    return `<fieldset class="section"><legend>${sec.title}</legend><div class="field-grid">${fieldsHtml}</div></fieldset>`;
  }).join("");

  // Công cụ: nối thêm khối "Thông số kỹ thuật" (liên kết qua cong_cu_ma <-> sheet
  // thongso_kythuat) để xem/thêm/sửa/xoá ngay trong lúc thêm mới hoặc sửa công cụ.
  if(currentSheet === "cong_cu"){
    body.innerHTML += `<fieldset class="section"><legend>Thông số kỹ thuật</legend><div id="ttContainerForm"></div></fieldset>`;
    await loadTtRowsForCongCu(record && record.cong_cu_ma);
    renderTtTable("ttContainerForm", false);
  }

  wireImageFields(body);
  pushOverlay("formOverlay");
  document.getElementById("formOverlay").classList.add("show");
  positionFullOverlay("formOverlay");
}

/* ---------- validate dữ liệu trước khi lưu (khớp với kiểm tra phía server ở
   Code.gs, giúp báo lỗi ngay tại chỗ thay vì phải chờ round-trip lên server) ---------- */
const EMAIL_REGEX_FE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const PHONE_REGEX_FE = /^(0\d{9,10}|\+84\d{9,10})$/;
function validateRecordData(data, sheet){
  const errors = [];
  if(data.email != null && String(data.email).trim() !== "" && !EMAIL_REGEX_FE.test(String(data.email).trim())){
    errors.push("Email không đúng định dạng: " + data.email);
  }
  if(data.phone != null && String(data.phone).trim() !== "" && !PHONE_REGEX_FE.test(String(data.phone).trim().replace(/[.\s-]/g,""))){
    errors.push("Số điện thoại không hợp lệ (vd 0912345678): " + data.phone);
  }
  const DATE_PAIRS = [
    ["ngay_thu_viec","ngay_chinh_thuc","Ngày chính thức phải từ sau Ngày thử việc trở đi"],
    ["ngay_thu_viec","ngay_nghi_viec","Ngày nghỉ việc phải từ sau Ngày thử việc trở đi"],
    ["ngay_nhan","ngay_sua","Ngày sửa phải từ sau Ngày nhận trở đi"]
  ];
  DATE_PAIRS.forEach(([fA,fB,msg])=>{
    if(!data[fA] || !data[fB]) return;
    const dA = new Date(vnToIso(data[fA])), dB = new Date(vnToIso(data[fB]));
    if(!isNaN(dA) && !isNaN(dB) && dB < dA) errors.push(msg);
  });
  if(data.chi_phi_sua != null && String(data.chi_phi_sua).trim() !== ""){
    const n = Number(String(data.chi_phi_sua).replace(/[^\d.-]/g,""));
    if(isNaN(n) || n < 0) errors.push("Chi phí sửa phải là một số không âm");
  }
  // gia_tri cũng dùng chung tên cột ở sheet thongso_kythuat (giá trị thuộc tính,
  // không phải số) nên chỉ kiểm tra số khi đang ở sheet công cụ (giá trị tài sản)
  if(sheet === "cong_cu" && data.gia_tri != null && String(data.gia_tri).trim() !== ""){
    const n = Number(String(data.gia_tri).replace(/[^\d.-]/g,""));
    if(isNaN(n) || n < 0) errors.push("Giá trị tài sản phải là một số không âm");
  }
  return errors;
}

function collectFormData(){
  const body = document.getElementById("formBody");
  const data = {};
  body.querySelectorAll("[data-field]").forEach(el=>{
    data[el.dataset.field] = el.dataset.datefield ? isoToVn(el.value) : el.value.trim();
  });
  return data;
}

document.getElementById("formCancel").onclick = closeForm;
function closeForm(){ popOverlay("formOverlay"); document.getElementById("formOverlay").classList.remove("show"); }

document.getElementById("formSave").onclick = ()=> doFormSave();
function doFormSave(){
  const cfg = CONFIG[currentSheet];
  const sheet = currentSheet;
  const data = collectFormData();
  const missingPk = cfg.pk.filter(f=>!data[f]);
  if(missingPk.length){ toast(`Vui lòng nhập ${missingPk.map(f=>L(f, sheet)).join(", ")}`, true); return; }
  const errors = validateRecordData(data, sheet);
  if(errors.length){ toast(errors.join(" · "), true); return; }

  const id = editingId;
  const isUpdate = !!editingId;
  closeForm();

  queueOperation(isUpdate ? "update" : "create", sheet, id, data, ()=>{
    if(!dataCache[sheet]) dataCache[sheet] = [];
    if(isUpdate){
      const idx = dataCache[sheet].findIndex(r=>idOf(r,cfg.pk)===id);
      if(idx>-1) dataCache[sheet][idx] = { ...dataCache[sheet][idx], ...data };
    }else{
      dataCache[sheet] = [...dataCache[sheet], { ...data }];
    }
  });
  if(sheet === "cong_cu"){
    syncTtRowsForCongCu(data.cong_cu_ma);
  }
  toast(isUpdate ? "Đã cập nhật (đang đồng bộ ngầm…)" : "Đã thêm mới (đang đồng bộ ngầm…)");
  refreshCounts();
  if(currentSheet===sheet) loadTable();
}

/* ---------- biểu đồ xu hướng theo tháng (SVG thuần, không cần thư viện) ---------- */
function last12MonthKeys(){
  const out = [];
  const now = new Date();
  for(let i=11; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`);
  }
  return out;
}
function vnDateMonthKey(v){
  const m = String(v||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return `${m[3]}-${m[2].padStart(2,"0")}`;
}
/* Vẽ 1..n đường (line chart) đơn giản trên cùng 1 trục thời gian (12 tháng),
   tự co giãn theo giá trị lớn nhất trong TẤT CẢ series để so sánh được. */
function sparklineSvg(monthKeys, series, fmt){
  fmt = fmt || (v=>v);
  const W = 760, H = 190, padL = 44, padR = 16, padT = 14, padB = 26;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const maxVal = Math.max(1, ...series.flatMap(s=>s.values));
  const x = i => padL + (monthKeys.length<=1 ? innerW/2 : (i/(monthKeys.length-1))*innerW);
  const y = v => padT + innerH - (v/maxVal)*innerH;
  const gridLines = [0,0.25,0.5,0.75,1].map(t=>{
    const yy = padT + innerH*(1-t);
    return `<line x1="${padL}" y1="${yy}" x2="${W-padR}" y2="${yy}" stroke="#ECEBDD" stroke-width="1"/>
      <text x="${padL-8}" y="${yy+4}" font-size="10" fill="#9AA391" text-anchor="end">${fmt(Math.round(maxVal*t))}</text>`;
  }).join("");
  const xLabels = monthKeys.map((mk,i)=>{
    if(monthKeys.length>6 && i%2===1) return ""; // đỡ chật khi có nhiều tháng
    const [yy,mm] = mk.split("-");
    return `<text x="${x(i)}" y="${H-6}" font-size="10" fill="#9AA391" text-anchor="middle">${mm}/${yy.slice(2)}</text>`;
  }).join("");
  const paths = series.map(s=>{
    const d = s.values.map((v,i)=> (i===0?"M":"L") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join(" ");
    const dots = s.values.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${s.color}"><title>${monthKeys[i]}: ${fmt(v)}</title></circle>`).join("");
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2"/>${dots}`;
  }).join("");
  const legend = series.length>1 ? `<div style="display:flex;gap:16px;margin-top:6px;flex-wrap:wrap;">
    ${series.map(s=>`<span style="font-size:11.5px;color:#5D6B57;"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.color};margin-right:5px;"></span>${s.name}</span>`).join("")}
  </div>` : "";
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;height:auto;display:block;">${gridLines}${xLabels}${paths}</svg>${legend}`;
}

/* ---------- lưu / xem lại biên bản bàn giao đã lập (sheet bien_ban) ---------- */
function collectBienBanForm(){
  return {
    so_bb: document.getElementById("bbSoBB").value.trim(),
    ngay_lap: isoToVn(document.getElementById("bbNgayLap").value),
    nguoi_lap: document.getElementById("bbNguoiLap").value.trim(),
    don_vi: document.getElementById("bbDonVi").value.trim(),
    nguoi_phu_trach: document.getElementById("bbNguoiPhuTrach").value.trim(),
    ben_giao: document.getElementById("bbBenGiao").value.trim(),
    ben_nhan: document.getElementById("bbBenNhan").value.trim(),
    dia_diem: document.getElementById("bbDiaDiem").value.trim(),
    danh_sach_json: JSON.stringify(bbRows.map(r=>({ ma:r.ma, ten:r.ten, dvt:r.dvt, sl:r.sl, ghichu:r.ghichu }))),
    ghi_chu: `${document.getElementById("bbCongTy").value.trim()} | ${document.getElementById("bbDonViSuDung").value.trim()}`
  };
}
async function saveBienBan(){
  const data = collectBienBanForm();
  if(!bbRows.length){ toast("Vui lòng thêm ít nhất 1 tài sản trước khi lưu", true); return; }
  if(!data.ben_giao || !data.ben_nhan){ toast("Vui lòng nhập Bên giao và Bên nhận trước khi lưu", true); return; }
  const btn = document.getElementById("bbSaveBtn");
  btn.disabled = true;
  try{
    let bienbanMa = bbEditingMa;
    if(!bienbanMa){
      bienbanMa = await apiFetchNextCode("bien_ban", "bienban_ma") || ("BB" + Date.now());
    }
    data.bienban_ma = bienbanMa;
    const result = await apiWriteRemote(bbEditingMa ? "update" : "create", "bien_ban", bbEditingMa ? { id: bienbanMa, data } : { data });
    bbEditingMa = bienbanMa;
    delete dataCache["bien_ban"];
    toast("Đã lưu biên bản " + bienbanMa + " thành công");
  }catch(err){
    toast("Lưu biên bản thất bại: " + err.message, true, saveBienBan);
  }finally{
    btn.disabled = false;
  }
}
async function toggleBienBanSavedList(){
  const wrap = document.getElementById("bbSavedListWrap");
  if(wrap.dataset.open === "1"){ wrap.innerHTML = ""; wrap.dataset.open = "0"; return; }
  wrap.dataset.open = "1";
  wrap.innerHTML = `<div class="bb-doc" style="padding:16px 20px;margin-bottom:16px;"><div class="loading-row">Đang tải danh sách…</div></div>`;

  try{ rows = await apiList("bien_ban"); }catch(e){ rows = []; }

    <h3 style="margin:0 0 10px;font-size:14.5px;color:var(--forest-deep);">Biên bản đã lưu (${rows.length})</h3>
    ${rows.length ? rows.map(r=>`
      <div class="sp-history-item" onclick="loadBienBanIntoForm('${escAttr(r.bienban_ma)}')">
        <div class="sp-history-top"><b>${r.bienban_ma}${r.so_bb?(" · Số "+r.so_bb):""}</b><span class="muted">${r.ngay_lap||"—"}</span></div>

      </div>`).join("") : '<p class="muted">Chưa có biên bản nào được lưu.</p>'}
